          cat > app/src/main/java/com/turbo/a03/WifiAdb.java << 'EOF_16'
          package com.turbo.a03;

          import android.app.Notification;
          import android.app.NotificationChannel;
          import android.app.NotificationManager;
          import android.app.PendingIntent;
          import android.app.RemoteInput;
          import android.content.Context;
          import android.content.Intent;
          import android.content.SharedPreferences;
          import android.graphics.drawable.Icon;
          import android.net.nsd.NsdManager;
          import android.net.nsd.NsdServiceInfo;
          import android.os.Build;
          import android.provider.Settings;
          import android.util.Base64;
          import io.github.muntashirakon.adb.AbsAdbConnectionManager;
          import io.github.muntashirakon.adb.AdbStream;
          import java.io.ByteArrayInputStream;
          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.math.BigInteger;
          import java.security.KeyFactory;
          import java.security.KeyPair;
          import java.security.KeyPairGenerator;
          import java.security.PrivateKey;
          import java.security.cert.Certificate;
          import java.security.cert.CertificateFactory;
          import java.security.spec.PKCS8EncodedKeySpec;
          import java.util.Date;
          import org.bouncycastle.asn1.x500.X500Name;
          import org.bouncycastle.cert.X509v3CertificateBuilder;
          import org.bouncycastle.cert.jcajce.JcaX509CertificateConverter;
          import org.bouncycastle.cert.jcajce.JcaX509v3CertificateBuilder;
          import org.bouncycastle.operator.ContentSigner;
          import org.bouncycastle.operator.jcajce.JcaContentSignerBuilder;

          /**
           * ADB por Depuração sem fio (Android 11+), feito pelo próprio celular, sem PC:
           * pareia com o código de 6 dígitos (digitado no aviso do Turbo), conecta por TLS e roda "shell:" como usuário shell.
           */
          final class WifiAdb {
            static final String CH = "pair";
            static volatile int pairPort = 0;
            static volatile boolean alive = false;
            static String lastErr = "";
            static Mgr mgr;
            static NsdManager.DiscoveryListener dl;

            /** Gerenciador de conexão: guarda chave RSA e certificado para o aparelho continuar autorizado. */
            static final class Mgr extends AbsAdbConnectionManager {
              PrivateKey pk;
              Certificate cert;

              Mgr(Context c) throws Exception {
                setApi(Build.VERSION.SDK_INT);
                SharedPreferences p = U.p(c);
                String k = p.getString("w_key", null), ce = p.getString("w_cert", null);
                if (k != null && ce != null) {
                  pk = KeyFactory.getInstance("RSA").generatePrivate(new PKCS8EncodedKeySpec(Base64.decode(k, Base64.NO_WRAP)));
                  cert = CertificateFactory.getInstance("X.509").generateCertificate(new ByteArrayInputStream(Base64.decode(ce, Base64.NO_WRAP)));
                } else {
                  KeyPairGenerator g = KeyPairGenerator.getInstance("RSA");
                  g.initialize(2048);
                  KeyPair kp = g.generateKeyPair();
                  pk = kp.getPrivate();
                  X500Name nm = new X500Name("CN=Turbo");
                  Date nb = new Date(System.currentTimeMillis() - 86400000L);
                  Date na = new Date(System.currentTimeMillis() + 3650L * 86400000L);
                  X509v3CertificateBuilder b = new JcaX509v3CertificateBuilder(nm, BigInteger.valueOf(System.currentTimeMillis()), nb, na, nm, kp.getPublic());
                  ContentSigner s = new JcaContentSignerBuilder("SHA256withRSA").build(pk);
                  cert = new JcaX509CertificateConverter().getCertificate(b.build(s));
                  p.edit().putString("w_key", Base64.encodeToString(pk.getEncoded(), Base64.NO_WRAP))
                      .putString("w_cert", Base64.encodeToString(cert.getEncoded(), Base64.NO_WRAP)).apply();
                }
              }

              @Override
              protected PrivateKey getPrivateKey() {
                return pk;
              }

              @Override
              protected Certificate getCertificate() {
                return cert;
              }

              @Override
              protected String getDeviceName() {
                return "turbo";
              }
            }

            static boolean supported() {
              return Build.VERSION.SDK_INT >= 30;
            }

            static boolean paired(Context c) {
              return U.p(c).getBoolean("w_paired", false);
            }

            static synchronized Mgr mgr(Context c) throws Exception {
              if (mgr == null) mgr = new Mgr(c.getApplicationContext());
              return mgr;
            }

            static String exec(AbsAdbConnectionManager m, String cmd, final int timeoutMs) throws Exception {
              final AdbStream st = m.openStream("shell:" + cmd);
              final Thread w = new Thread(new Runnable() {
                public void run() {
                  try {
                    Thread.sleep(timeoutMs);
                    st.close();
                  } catch (Throwable t) {
                  }
                }
              });
              w.start();
              try {
                InputStream in = st.openInputStream();
                ByteArrayOutputStream o = new ByteArrayOutputStream();
                byte[] b = new byte[8192];
                int n;
                while ((n = in.read(b)) > 0 && o.size() < (4 << 20)) o.write(b, 0, n);
                return o.toString("UTF-8");
              } finally {
                w.interrupt();
                try {
                  st.close();
                } catch (Throwable t) {
                }
              }
            }

            static void connectNow(Context c, Mgr m) throws Exception {
              try {
                Settings.Global.putInt(c.getContentResolver(), "adb_wifi_enabled", 1);
              } catch (Throwable t) {
              }
              for (int i = 0; i < 2 && !alive; i++) {
                try {
                  m.connectTls(c, 8000);
                  alive = exec(m, "echo ok", 5000).contains("ok");
                } catch (Throwable t) {
                  lastErr = String.valueOf(t.getMessage());
                }
              }
              if (!alive) {
                throw new IOException("Depuração sem fio indisponível: ligue o Wi-Fi e a \"Depuração sem fio\". " + lastErr);
              }
            }

            /** Roda comandos no shell. Em erro retorna texto começando com "ERRO ADB". */
            static synchronized String run(Context c, int timeoutMs, String... cmds) {
              try {
                Mgr m = mgr(c);
                if (!alive) connectNow(c, m);
                StringBuilder sb = new StringBuilder();
                try {
                  for (String s : cmds) sb.append(exec(m, s, timeoutMs));
                } catch (Throwable e) {
                  alive = false;
                  connectNow(c, m);
                  sb.setLength(0);
                  for (String s : cmds) sb.append(exec(m, s, timeoutMs));
                }
                return sb.toString();
              } catch (Throwable e) {
                alive = false;
                return "ERRO ADB: " + (e.getMessage() == null ? e.toString() : e.getMessage());
              }
            }

            // ---------------- pareamento ----------------

            static void startPairing(Context c) {
              if (!supported()) {
                U.log("Depuração sem fio exige Android 11 ou mais novo");
                return;
              }
              final Context ac = c.getApplicationContext();
              NotificationManager nm = (NotificationManager) ac.getSystemService(Context.NOTIFICATION_SERVICE);
              nm.createNotificationChannel(new NotificationChannel(CH, "Pareamento ADB", NotificationManager.IMPORTANCE_HIGH));
              pairPort = 0;
              notifyPair(ac, "Abra \"Parear com código\" e digite aqui o código de 6 dígitos.");
              discover(ac);
            }

            static void notifyPair(Context c, String text) {
              Intent i = new Intent(c, PairReceiver.class);
              int fl = PendingIntent.FLAG_UPDATE_CURRENT | (Build.VERSION.SDK_INT >= 31 ? PendingIntent.FLAG_MUTABLE : 0);
              PendingIntent pi = PendingIntent.getBroadcast(c, 7, i, fl);
              RemoteInput ri = new RemoteInput.Builder("code").setLabel("Código de 6 dígitos").build();
              Notification.Action ac = new Notification.Action.Builder(Icon.createWithResource(c, R.drawable.ic_bolt), "Digitar código", pi)
                  .addRemoteInput(ri).build();
              Notification n = new Notification.Builder(c, CH)
                  .setSmallIcon(R.drawable.ic_bolt)
                  .setContentTitle("Turbo • pareamento ADB")
                  .setContentText(text)
                  .setStyle(new Notification.BigTextStyle().bigText(text))
                  .setOnlyAlertOnce(true)
                  .setTimeoutAfter(180000)
                  .addAction(ac)
                  .build();
              ((NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE)).notify(7, n);
            }

            static void doneNote(Context c, String text) {
              Notification n = new Notification.Builder(c, CH)
                  .setSmallIcon(R.drawable.ic_bolt)
                  .setContentTitle("Turbo • ADB")
                  .setContentText(text)
                  .setTimeoutAfter(15000)
                  .build();
              ((NotificationManager) c.getSystemService(Context.NOTIFICATION_SERVICE)).notify(7, n);
            }

            static void discover(final Context c) {
              stopDiscovery(c);
              final NsdManager nsd = (NsdManager) c.getSystemService(Context.NSD_SERVICE);
              dl = new NsdManager.DiscoveryListener() {
                public void onStartDiscoveryFailed(String t, int e) {
                  U.log("Busca do pareamento falhou (" + e + "). Use o pareamento manual.");
                }

                public void onStopDiscoveryFailed(String t, int e) {
                }

                public void onDiscoveryStarted(String t) {
                }

                public void onDiscoveryStopped(String t) {
                }

                public void onServiceLost(NsdServiceInfo i) {
                  pairPort = 0;
                }

                public void onServiceFound(NsdServiceInfo i) {
                  try {
                    nsd.resolveService(i, new NsdManager.ResolveListener() {
                      public void onResolveFailed(NsdServiceInfo s, int e) {
                      }

                      public void onServiceResolved(NsdServiceInfo s) {
                        pairPort = s.getPort();
                        U.log("Serviço de pareamento encontrado (porta " + pairPort + ")");
                      }
                    });
                  } catch (Throwable t) {
                  }
                }
              };
              try {
                nsd.discoverServices("_adb-tls-pairing._tcp", NsdManager.PROTOCOL_DNS_SD, dl);
              } catch (Throwable t) {
                U.log("Busca do pareamento: " + t);
              }
            }

            static void stopDiscovery(Context c) {
              if (dl == null) return;
              try {
                ((NsdManager) c.getSystemService(Context.NSD_SERVICE)).stopServiceDiscovery(dl);
              } catch (Throwable t) {
              }
              dl = null;
            }

            static void pairManual(Context c, int port, String code) {
              pairPort = port;
              pairFlow(c.getApplicationContext(), code);
            }

            /** Pareia com o código, conecta e já concede as permissões ao app. */
            static void pairFlow(Context c, String code) {
              try {
                code = code == null ? "" : code.trim();
                if (code.length() != 6) {
                  notifyPair(c, "O código tem 6 números. Digite de novo.");
                  return;
                }
                long end = System.currentTimeMillis() + 10000;
                while (pairPort == 0 && System.currentTimeMillis() < end) Tuner.nap(300);
                int port = pairPort;
                if (port == 0) {
                  notifyPair(c, "Não achei a porta de pareamento. Deixe a janela \"Parear com código\" aberta e digite de novo.");
                  return;
                }
                U.log("Pareando na porta " + port + "…");
                Mgr m = mgr(c);
                synchronized (WifiAdb.class) {
                  m.pair("127.0.0.1", port, code);
                }
                U.p(c).edit().putBoolean("w_paired", true).apply();
                stopDiscovery(c);
                alive = false;
                U.log("Pareado! Conectando…");
                String r = run(c, 20000, "id");
                boolean ok = Adb.ok(r);
                U.p(c).edit().putBoolean("adb_ok", ok).apply();
                if (ok) {
                  U.log("ADB sem fio conectado: " + Opt.brief(r));
                  Opt.grantSelf(c);
                  doneNote(c, "Conectado ✔ Permissões concedidas. Pode fechar as Opções do desenvolvedor.");
                } else {
                  U.log(Opt.brief(r));
                  doneNote(c, "Pareou, mas não conectou: " + Opt.brief(r));
                }
              } catch (Throwable t) {
                U.log("Pareamento falhou: " + t.getMessage());
                notifyPair(c, "Falhou: " + t.getMessage() + ". Confira o código e tente de novo.");
              }
            }
          }
          EOF_16
