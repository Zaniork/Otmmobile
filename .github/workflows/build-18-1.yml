            void pickApps(String title, final String key, final Runnable after) {
              final PackageManager pm = getPackageManager();
              List<ApplicationInfo> l = pm.getInstalledApplications(0);
              Collections.sort(l, new java.util.Comparator<ApplicationInfo>() {
                public int compare(ApplicationInfo a, ApplicationInfo b) {
                  return pm.getApplicationLabel(a).toString().compareToIgnoreCase(pm.getApplicationLabel(b).toString());
                }
              });
              Set<String> cur = new HashSet<String>(U.p(this).getStringSet(key, new HashSet<String>()));
              final ArrayList<String> pk = new ArrayList<>();
              ArrayList<String> lb = new ArrayList<>();
              for (ApplicationInfo a : l) {
                boolean sys = (a.flags & ApplicationInfo.FLAG_SYSTEM) != 0 && (a.flags & ApplicationInfo.FLAG_UPDATED_SYSTEM_APP) == 0;
                if (sys || a.packageName.equals(getPackageName()) || pm.getLaunchIntentForPackage(a.packageName) == null) continue;
                pk.add(a.packageName);
                lb.add(pm.getApplicationLabel(a).toString());
              }
              final boolean[] ch = new boolean[pk.size()];
              for (int i = 0; i < ch.length; i++) ch[i] = cur.contains(pk.get(i));
              new AlertDialog.Builder(this)
                  .setTitle(title)
                  .setMultiChoiceItems(lb.toArray(new String[0]), ch, new android.content.DialogInterface.OnMultiChoiceClickListener() {
                    public void onClick(android.content.DialogInterface d, int i, boolean on) {
                      ch[i] = on;
                    }
                  })
                  .setPositiveButton("OK", new android.content.DialogInterface.OnClickListener() {
                    public void onClick(android.content.DialogInterface d, int w) {
                      HashSet<String> n = new HashSet<>();
                      for (int i = 0; i < ch.length; i++) if (ch[i]) n.add(pk.get(i));
                      U.p(MainActivity.this).edit().putStringSet(key, n).apply();
                      after.run();
                    }
                  })
                  .setNegativeButton("Cancelar", null)
                  .show();
            }

            void upd() {
              long[] m = U.mem(this);
              long[] d = U.disk();
              float[] b = U.batt(this);
              tvStat.setText("RAM livre: " + U.mb(m[0]) + " de " + U.mb(m[1]) + " (" + Math.round(100f * m[0] / Math.max(1L, m[1])) + "%)\n"
                  + "Armazenamento livre: " + U.mb(d[0]) + " de " + U.mb(d[1]) + "\n"
                  + "Bateria: " + Math.round(b[0]) + "% • " + b[1] + " °C" + (b[2] > 0 ? " (carregando)" : "") + "\n"
                  + "RAM liberada pelo app (total): " + U.mb(U.p(this).getLong("freed_total", 0)));
              boolean bat = false;
              try {
                bat = ((PowerManager) getSystemService(POWER_SERVICE)).isIgnoringBatteryOptimizations(getPackageName());
              } catch (Throwable t) {
              }
              tvSvc.setText("Serviço: " + (OptService.running ? "ATIVO" : "desativado")
                  + "  •  ADB: " + (U.p(this).getBoolean("adb_ok", false) ? "autorizado" : "não conectado")
                  + "\nAcesso de uso: " + (Opt.hasUsage(this) ? "ok" : "falta")
                  + "  •  Bateria irrestrita: " + (bat ? "ok" : "falta"));
              tvAi.setText(Brain.I.summary(this));
              tvTune.setText(Tuner.report(this));
              tvLog.setText(U.logText());
            }

            final Runnable refresh = new Runnable() {
              public void run() {
                try {
                  upd();
                } catch (Throwable t) {
                }
                ui.postDelayed(this, 2000);
              }
            };

            @Override
            protected void onResume() {
              super.onResume();
              sw.setChecked(U.enabled(this));
              ui.post(refresh);
            }

            @Override
            protected void onPause() {
              super.onPause();
              ui.removeCallbacks(refresh);
            }
