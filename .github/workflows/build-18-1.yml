            static String revert(Context c, M m) {
              SharedPreferences p = U.p(c);
              switch (m.kind) {
                case ST: {
                  ArrayList<String> cmds = new ArrayList<>();
                  SharedPreferences.Editor e = p.edit();
                  for (int i = 0; i < m.on.length; i++) {
                    String key = "orig_" + m.id + "_" + i;
                    String o = p.getString(key, null);
                    Matcher k = SET.matcher(m.on[i]);
                    if (k.find() && o != null) {
                      if (o.isEmpty() || o.equals("null")) cmds.add("settings delete " + k.group(1) + " " + k.group(2));
                      else cmds.add("settings put " + k.group(1) + " " + k.group(2) + " '" + o.replace("'", "") + "'");
                    } else {
                      cmds.add(m.off[Math.min(i, m.off.length - 1)]);
