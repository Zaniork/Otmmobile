            /** Apps de terceiros que mais usam memória agora (fora os protegidos). */
            static ArrayList<String> heavy(Context c, int n) {
              ArrayList<String> out = new ArrayList<>();
              String r = Adb.run(c, 45000, "dumpsys meminfo");
              if (!Adb.ok(r)) return out;
              int from = r.indexOf("Total PSS by process");
              if (from < 0) return out;
              int to = r.indexOf("Total PSS by OOM adjustment", from);
              String sec = to > 0 ? r.substring(from, to) : r.substring(from);
              PackageManager pm = c.getPackageManager();
              Set<String> keep = Opt.protect(c, 6);
              Matcher m = Pattern.compile("(?m)^\\s*[\\d.,]+K: ([\\w.]+)").matcher(sec);
              while (m.find() && out.size() < n) {
                String pk = m.group(1);
                if (keep.contains(pk) || out.contains(pk)) continue;
                try {
                  ApplicationInfo a = pm.getApplicationInfo(pk, 0);
                  boolean sys = (a.flags & ApplicationInfo.FLAG_SYSTEM) != 0 && (a.flags & ApplicationInfo.FLAG_UPDATED_SYSTEM_APP) == 0;
                  if (!sys) out.add(pk);
                } catch (Throwable t) {
                }
              }
              return out;
            }

