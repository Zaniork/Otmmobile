          package com.turbo.a03;

          import android.app.RemoteInput;
          import android.content.BroadcastReceiver;
          import android.content.Context;
          import android.content.Intent;
          import android.os.Bundle;

          /** Recebe o código de pareamento digitado no aviso (RemoteInput) e conclui o pareamento em segundo plano. */
          public class PairReceiver extends BroadcastReceiver {
            @Override
            public void onReceive(final Context c, Intent i) {
              Bundle b = RemoteInput.getResultsFromIntent(i);
              CharSequence cs = b == null ? null : b.getCharSequence("code");
              final String code = cs == null ? "" : cs.toString();
              final PendingResult pr = goAsync();
              new Thread(new Runnable() {
                public void run() {
                  try {
                    WifiAdb.pairFlow(c.getApplicationContext(), code);
                  } finally {
                    pr.finish();
                  }
                }
              }).start();
            }
          }
          EOF_17

      - name: Aceitar licencas do SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true

      - name: Compilar
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Renomear APK
        run: cp app/build/outputs/apk/debug/app-debug.apk Turbo.apk

      - name: Guardar APK (Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: Turbo-APK
          path: Turbo.apk

      - name: Publicar APK em Releases (download direto)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: turbo-${{ github.run_number }}
          name: Turbo ${{ github.run_number }}
          files: Turbo.apk
