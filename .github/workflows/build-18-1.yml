          package com.turbo.a03;

          import android.app.ActivityManager;
          import android.content.ComponentName;
          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.SharedPreferences;
          import android.content.pm.PackageManager;
          import android.os.Environment;
          import android.os.StatFs;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Date;
          import java.util.Locale;

          final class U {
            static SharedPreferences p(Context c) {
              return c.getApplicationContext().getSharedPreferences("turbo", Context.MODE_PRIVATE);
            }

            private static final ArrayList<String> L = new ArrayList<>();

            static synchronized void log(String s) {
              String t = new SimpleDateFormat("HH:mm:ss", Locale.US).format(new Date()) + "  " + s;
              L.add(t);
              while (L.size() > 60) L.remove(0);
            }

            static synchronized String logText() {
              StringBuilder b = new StringBuilder();
              for (int i = L.size() - 1; i >= 0; i--) b.append(L.get(i)).append('\n');
              return b.length() == 0 ? "(sem eventos ainda)" : b.toString();
            }

            /** {livre, total, lowMemory(0/1), threshold} */
            static long[] mem(Context c) {
              ActivityManager am = (ActivityManager) c.getSystemService(Context.ACTIVITY_SERVICE);
              ActivityManager.MemoryInfo mi = new ActivityManager.MemoryInfo();
              am.getMemoryInfo(mi);
              return new long[]{mi.availMem, mi.totalMem, mi.lowMemory ? 1 : 0, mi.threshold};
            }

            /** {nivel%, temperaturaC, carregando(0/1)} */
            static float[] batt(Context c) {
              Intent i = c.registerReceiver(null, new IntentFilter(Intent.ACTION_BATTERY_CHANGED));
              if (i == null) return new float[]{0, 0, 0};
              int l = i.getIntExtra("level", 0);
              int s = i.getIntExtra("scale", 100);
              float t = i.getIntExtra("temperature", 0) / 10f;
              int st = i.getIntExtra("status", 0);
              boolean ch = st == 2 || st == 5;
              return new float[]{100f * l / Math.max(1, s), t, ch ? 1 : 0};
            }

            static long[] disk() {
              StatFs s = new StatFs(Environment.getDataDirectory().getPath());
              return new long[]{s.getAvailableBytes(), s.getTotalBytes()};
            }

            static String mb(long b) {
              return (b / 1048576L) + " MB";
            }

            static boolean enabled(Context c) {
              return p(c).getBoolean("enabled", false);
            }

            static void setEnabled(Context c, boolean on) {
              p(c).edit().putBoolean("enabled", on).apply();
              try {
                ComponentName cn = new ComponentName(c, BootReceiver.class);
                c.getPackageManager().setComponentEnabledSetting(cn,
                    on ? PackageManager.COMPONENT_ENABLED_STATE_ENABLED : PackageManager.COMPONENT_ENABLED_STATE_DISABLED,
                    PackageManager.DONT_KILL_APP);
              } catch (Throwable t) {
              }
              Intent i = new Intent(c, OptService.class);
              if (on) {
                try {
                  c.startForegroundService(i);
                  log("Serviço ligado");
                } catch (Throwable t) {
                  log("Não consegui iniciar o serviço: " + t.getMessage());
                }
              } else {
                c.stopService(i);
                log("Serviço desativado");
              }
            }
          }
