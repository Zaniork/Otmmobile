            static boolean hasUsage(Context c) {
              try {
                AppOpsManager a = (AppOpsManager) c.getSystemService(Context.APP_OPS_SERVICE);
                return a.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), c.getPackageName()) == AppOpsManager.MODE_ALLOWED;
              } catch (Throwable t) {
                return false;
              }
            }

            /** Apps que NUNCA são fechados: launcher, teclado, telefone, SMS, os que você usa mais e os usados há pouco. */
            static Set<String> protect(Context c, int top) {
              HashSet<String> s = new HashSet<>();
              s.add(c.getPackageName());
              PackageManager pm = c.getPackageManager();
              try {
                ResolveInfo r = pm.resolveActivity(new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME), PackageManager.MATCH_DEFAULT_ONLY);
                if (r != null && r.activityInfo != null) s.add(r.activityInfo.packageName);
              } catch (Throwable t) {
              }
              try {
                String ime = Settings.Secure.getString(c.getContentResolver(), Settings.Secure.DEFAULT_INPUT_METHOD);
                if (ime != null && ime.indexOf('/') > 0) s.add(ime.substring(0, ime.indexOf('/')));
              } catch (Throwable t) {
              }
              try {
                TelecomManager tm = (TelecomManager) c.getSystemService(Context.TELECOM_SERVICE);
                String d = tm.getDefaultDialerPackage();
                if (d != null) s.add(d);
              } catch (Throwable t) {
              }
              try {
                String sm = Telephony.Sms.getDefaultSmsPackage(c);
                if (sm != null) s.add(sm);
              } catch (Throwable t) {
              }
              s.addAll(U.p(c).getStringSet("whitelist", new HashSet<String>()));
              if (hasUsage(c)) {
                try {
                  UsageStatsManager u = (UsageStatsManager) c.getSystemService(Context.USAGE_STATS_SERVICE);
                  long now = System.currentTimeMillis();
                  List<UsageStats> l = u.queryUsageStats(UsageStatsManager.INTERVAL_DAILY, now - 3 * 86400000L, now);
                  if (l != null) {
                    HashMap<String, Long> tot = new HashMap<>();
                    for (UsageStats us : l) {
                      if (now - us.getLastTimeUsed() < 15 * 60000L) s.add(us.getPackageName());
                      Long o = tot.get(us.getPackageName());
                      tot.put(us.getPackageName(), (o == null ? 0L : o) + us.getTotalTimeInForeground());
                    }
                    ArrayList<Map.Entry<String, Long>> es = new ArrayList<>(tot.entrySet());
                    Collections.sort(es, (a, b) -> Long.compare(b.getValue(), a.getValue()));
                    for (int i = 0; i < es.size() && i < top; i++) s.add(es.get(i).getKey());
                  }
                } catch (Throwable t) {
                }
              }
