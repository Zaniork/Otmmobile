          package com.turbo.a03;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.content.pm.ApplicationInfo;
          import android.content.pm.PackageManager;
          import java.util.ArrayList;
          import java.util.Collections;
          import java.util.Comparator;
          import java.util.HashMap;
          import java.util.HashSet;
          import java.util.Random;
          import java.util.Set;
          import java.util.regex.Matcher;
          import java.util.regex.Pattern;

          /** Catálogo de métodos que o auto-testador liga/desliga e mede (RAM livre + velocidade da CPU). */
          final class Methods {
            static final int ST = 0, RESTRICT = 1, BUCKET = 2, KILLHEAVY = 3, TRIM = 4, CLEAN = 5, IDLE = 6;
            static final Pattern SET = Pattern.compile("^settings put (global|system|secure) (\\S+) ");

            static final class M {
              final String id, label, group;
              final int kind;
              final String[] on, off;

              M(String id, String label, String group, int kind, String[] on, String[] off) {
                this.id = id;
                this.label = label;
                this.group = group;
                this.kind = kind;
                this.on = on;
                this.off = off;
              }

              /** Ação pontual (não tem "desligar"): limpar, compactar, manutenção. */
              boolean action() {
                return kind == KILLHEAVY || kind == TRIM || kind == CLEAN || kind == IDLE;
              }
            }

            static final ArrayList<M> ALL = new ArrayList<>();

            static void st(String id, String label, String group, String on, String off) {
              ALL.add(new M(id, label, group, ST, on.split(";;"), off.split(";;")));
