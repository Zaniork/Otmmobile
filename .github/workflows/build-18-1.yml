          package com.turbo.a03;

          import android.content.Context;
          import android.content.Intent;
          import android.content.IntentFilter;
          import android.content.SharedPreferences;
          import android.os.SystemClock;
          import java.text.SimpleDateFormat;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Date;
          import java.util.HashSet;
          import java.util.Locale;
          import java.util.Set;
          import java.util.concurrent.atomic.AtomicBoolean;

          /**
           * Auto-testador: liga um método por vez, mede RAM livre + velocidade da CPU, mantém só o que melhora
           * (sempre crescente), desativa o que piora, poda o que não contribui e termina deixando o conjunto do pico.
           */
          final class Tuner {
            static final AtomicBoolean busy = new AtomicBoolean(false);
            static volatile boolean cancel = false;
            static volatile String status = "parado";
            static volatile boolean reapplied = false;
            static volatile long lastTry = 0;

            static void nap(long ms) {
              try {
                Thread.sleep(ms);
              } catch (InterruptedException e) {
              }
            }

            /** Mini benchmark de CPU (todos os núcleos). Retorna operações por ms: mais alto = processador mais rápido. */
            static float bench() {
              final int nt = Math.max(2, Math.min(8, Runtime.getRuntime().availableProcessors()));
              final int it = 6000000;
              final long[] sink = new long[nt];
              Thread[] ts = new Thread[nt];
              long t0 = System.nanoTime();
              for (int i = 0; i < nt; i++) {
                final int ix = i;
                ts[i] = new Thread(new Runnable() {
                  public void run() {
                    long x = 88172645463325252L + ix;
                    double d = 1.0;
                    for (int k = 0; k < it; k++) {
                      x ^= x << 13;
                      x ^= x >>> 7;
                      x ^= x << 17;
                      d = d * 1.0000001 + (x & 7);
                    }
                    sink[ix] = x + (long) d;
                  }
                });
                ts[i].start();
              }
              for (int i = 0; i < nt; i++) {
                try {
                  ts[i].join();
                } catch (InterruptedException e) {
                }
              }
              double ms = Math.max(1.0, (System.nanoTime() - t0) / 1e6);
              return (float) ((double) nt * it / ms);
            }

            /** {RAM livre em MB, CPU} usando a mediana de 3 leituras. */
            static float[] sample(Context c) {
              float[] r = new float[3], p = new float[3];
              for (int i = 0; i < 3; i++) {
                r[i] = U.mem(c)[0] / 1048576f;
                p[i] = bench();
                nap(250);
              }
              Arrays.sort(r);
              Arrays.sort(p);
              return new float[]{r[1], p[1]};
            }

            static float[] weights(Context c) {
              int g = U.p(c).getInt("tune_goal", 0);
              if (g == 1) return new float[]{0.8f, 0.2f};
              if (g == 2) return new float[]{0.2f, 0.8f};
              return new float[]{0.5f, 0.5f};
            }

            static float score(float[] s, float[] base, float[] w) {
              return w[0] * s[0] / Math.max(1f, base[0]) + w[1] * s[1] / Math.max(1f, base[1]);
            }

            static void stat(Context c, String id, boolean win) {
              SharedPreferences p = U.p(c);
              p.edit().putInt("ts_t_" + id, p.getInt("ts_t_" + id, 0) + 1)
                  .putInt("ts_w_" + id, p.getInt("ts_w_" + id, 0) + (win ? 1 : 0)).apply();
            }

            static void unsupported(Context c, String id) {
              SharedPreferences p = U.p(c);
              HashSet<String> s = new HashSet<String>(p.getStringSet("tune_unsup", new HashSet<String>()));
              s.add(id);
              p.edit().putStringSet("tune_unsup", s).apply();
            }

            static Methods.M groupMate(Set<String> active, Methods.M m) {
              if (m.group == null) return null;
              for (String a : active) {
                Methods.M o = Methods.byId(a);
                if (o != null && !o.id.equals(m.id) && m.group.equals(o.group)) return o;
              }
              return null;
            }

            static void run(Context c, int secs, String why) {
              if (!busy.compareAndSet(false, true)) return;
              cancel = false;
              ArrayList<String> rep = new ArrayList<>();
              try {
                status = "conectando ao ADB…";
                String id = Adb.run(c, 30000, "id");
                if (!Adb.ok(id)) {
                  U.log("Auto-testador: ADB indisponível — " + Opt.brief(id));
                  status = "ADB indisponível";
                  return;
                }
                SharedPreferences p = U.p(c);
                float[] w = weights(c);
                long end = SystemClock.elapsedRealtime() + secs * 1000L;
                HashSet<String> active = new HashSet<String>(p.getStringSet("tune_active", new HashSet<String>()));
                for (String a : new ArrayList<String>(active)) {
                  Methods.M m = Methods.byId(a);
                  if (m == null) active.remove(a);
                  else if (!m.action()) Methods.apply(c, m);
                }
                U.log("Auto-testador (" + why + "): " + secs + " s, " + Methods.ALL.size() + " métodos no catálogo");
                status = "medindo a base…";
                nap(2500);
                float[] b1 = sample(c);
                nap(2000);
                float[] b2 = sample(c);
                final float[] base = {(b1[0] + b2[0]) / 2f, (b1[1] + b2[1]) / 2f};
                float noise = Math.abs(score(b1, base, w) - score(b2, base, w));
                float margin = Math.max(0.015f, Math.min(0.05f, noise * 1.5f));
                float best = 1f;
                HashSet<String> bestSet = new HashSet<String>(active);
                U.log(String.format(Locale.US, "Base: RAM livre %.0f MB • CPU %.0f • margem %.1f%%", base[0], base[1], margin * 100f));
                boolean abort = false;
                int pass = 0;
                while (!abort && !cancel && pass < 3 && SystemClock.elapsedRealtime() < end - 8000) {
                  pass++;
                  boolean accepted = false;
                  for (Methods.M m : Methods.order(c, active)) {
                    if (cancel || SystemClock.elapsedRealtime() > end - 8000) break;
                    status = "passo " + pass + ": testando " + m.label;
                    Methods.M prev = groupMate(active, m);
                    if (prev != null) Methods.revert(c, prev);
                    String out = Methods.apply(c, m);
                    if (Methods.bad(out)) {
                      if (!Adb.ok(out)) {
                        U.log("Auto-testador: ADB caiu — " + Opt.brief(out));
                        Methods.revert(c, m);
                        if (prev != null) Methods.apply(c, prev);
                        abort = true;
                        break;
                      }
                      Methods.revert(c, m);
                      if (prev != null) Methods.apply(c, prev);
                      unsupported(c, m.id);
                      U.log("— " + m.label + ": indisponível neste aparelho");
                      continue;
                    }
                    nap(m.action() ? 3500 : 2200);
                    float sc = score(sample(c), base, w);
                    if (sc > best + margin) {
                      String l = String.format(Locale.US, "✔ %s (+%.1f%%)", m.label, (sc - best) * 100f);
                      U.log(l);
                      rep.add(l);
                      if (prev != null) active.remove(prev.id);
                      active.add(m.id);
                      best = sc;
                      bestSet = new HashSet<String>(active);
                      accepted = true;
                      stat(c, m.id, true);
                    } else {
                      Methods.revert(c, m);
                      if (prev != null) Methods.apply(c, prev);
                      U.log("✖ " + m.label + " (sem ganho, desligado)");
                      stat(c, m.id, false);
                    }
                  }
                  // poda: o que continua ligado mas não contribui é desligado
                  if (!abort && !cancel && SystemClock.elapsedRealtime() < end - 8000) {
                    for (String a : new ArrayList<String>(active)) {
                      Methods.M m = Methods.byId(a);
                      if (m == null || m.action()) continue;
                      if (cancel || SystemClock.elapsedRealtime() > end - 8000) break;
                      status = "podando: " + m.label;
                      Methods.revert(c, m);
                      nap(2200);
                      float sc = score(sample(c), base, w);
                      if (sc >= best - margin * 0.5f) {
                        active.remove(a);
                        best = Math.max(best, sc);
                        String l = "↩ " + m.label + " (não contribuía)";
                        U.log(l);
                        rep.add(l);
                      } else {
                        Methods.apply(c, m);
                      }
                    }
                    bestSet = new HashSet<String>(active);
                  }
                  if (!accepted && pass >= 2) break;
                }
                // deixa exatamente o conjunto do pico aplicado
                for (String a : new ArrayList<String>(active)) {
                  if (!bestSet.contains(a)) {
                    Methods.M m = Methods.byId(a);
                    if (m != null) Methods.revert(c, m);
                  }
                }
                for (String a : bestSet) {
                  if (!active.contains(a)) {
                    Methods.M m = Methods.byId(a);
                    if (m != null && !m.action()) Methods.apply(c, m);
                  }
                }
                status = "medindo o resultado final…";
                nap(2000);
                float[] fin = sample(c);
                float ramGain = fin[0] - base[0];
                float cpuGain = (fin[1] / Math.max(1f, base[1]) - 1f) * 100f;
                p.edit().putStringSet("tune_active", bestSet).putLong("tune_last", System.currentTimeMillis())
                    .putFloat("tune_peak", best).putBoolean("tune_pending", false).apply();
                String sum = String.format(Locale.US, "Pico: %d métodos ativos • RAM %s%.0f MB • CPU %s%.1f%%",
                    bestSet.size(), ramGain >= 0 ? "+" : "", ramGain, cpuGain >= 0 ? "+" : "", cpuGain);
                U.log(sum);
                rep.add(0, sum);
                StringBuilder sb = new StringBuilder();
                for (int i = 0; i < rep.size() && i < 14; i++) sb.append(rep.get(i)).append('\n');
                p.edit().putString("tune_rep", sb.toString()).apply();
                status = cancel ? "cancelado (pico aplicado)" : "concluído";
              } catch (Throwable t) {
                U.log("Auto-testador: erro " + t);
                status = "erro";
              } finally {
                busy.set(false);
              }
            }

            /** Reaplica o que já foi aprovado (device_config e propriedades somem ao reiniciar). */
            static void reapply(Context c) {
              if (!busy.compareAndSet(false, true)) return;
              try {
                String id = Adb.run(c, 20000, "id");
                if (!Adb.ok(id)) return;
                SharedPreferences p = U.p(c);
                int n = 0;
                for (String a : p.getStringSet("tune_active", new HashSet<String>())) {
                  Methods.M m = Methods.byId(a);
                  if (m != null && !m.action()) {
                    Methods.apply(c, m);
                    n++;
                  }
                }
                if (p.getBoolean("render_on", false)) renderer(c, true);
                reapplied = true;
                U.log("Métodos reaplicados: " + n);
              } catch (Throwable t) {
                U.log("Reaplicar: " + t);
              } finally {
                busy.set(false);
              }
            }

            static void undoAll(Context c) {
              cancel = true;
              for (int i = 0; i < 40 && busy.get(); i++) nap(500);
              SharedPreferences p = U.p(c);
              int n = 0;
              for (String a : p.getStringSet("tune_active", new HashSet<String>())) {
                Methods.M m = Methods.byId(a);
                if (m != null && !m.action()) {
                  Methods.revert(c, m);
                  n++;
                }
              }
              renderer(c, false);
              p.edit().remove("tune_active").remove("tune_peak").remove("tune_rep").putBoolean("render_on", false).apply();
              status = "parado";
              U.log("Métodos desfeitos: " + n);
            }

            static void renderer(Context c, boolean on) {
              String r = Adb.run(c, 15000, on ? "setprop debug.hwui.renderer skiagl" : "setprop debug.hwui.renderer \"\"");
              U.log("Renderizador " + (on ? "leve (Skia GL)" : "padrão") + ": " + Opt.brief(r) + " (vale para apps abertos a partir de agora)");
            }

            /** Chamado a cada ciclo do serviço: reaplica após o boot e re-testa nos intervalos escolhidos. */
            static void tick(final Context c, boolean screenOn) {
              final SharedPreferences p = U.p(c);
              boolean tuneOn = p.getBoolean("tune_on", false);
              if (!tuneOn && !p.getBoolean("render_on", false)) return;
              if (busy.get()) return;
              long now = System.currentTimeMillis();
              if (!reapplied) {
                if (now - lastTry > 90000L) {
                  lastTry = now;
                  new Thread(new Runnable() {
                    public void run() {
                      reapply(c);
                    }
                  }).start();
                }
                return;
              }
              if (!tuneOn) return;
              boolean pending = p.getBoolean("tune_pending", false);
              int every = p.getInt("tune_every_h", 0);
              boolean due = every > 0 && now - p.getLong("tune_last", 0) > every * 3600000L;
              boolean calm = !screenOn || U.batt(c)[2] > 0;
              if (!pending && !(due && calm && U.batt(c)[0] > 25f)) return;
              if (now - lastTry < 120000L) return;
              lastTry = now;
              final int secs = p.getInt("tune_secs", 120);
              final String why = pending ? "ligado agora" : "automático";
              new Thread(new Runnable() {
                public void run() {
                  Tuner.run(c, secs, why);
                }
              }).start();
            }

            static String report(Context c) {
              SharedPreferences p = U.p(c);
              Set<String> act = p.getStringSet("tune_active", new HashSet<String>());
              Set<String> un = p.getStringSet("tune_unsup", new HashSet<String>());
              StringBuilder sb = new StringBuilder();
              sb.append("Situação: ").append(busy.get() ? status : (status == null ? "parado" : status)).append('\n');
              sb.append("Catálogo: ").append(Methods.ALL.size()).append(" métodos • ").append(un.size()).append(" indisponíveis neste aparelho\n");
              sb.append("Ativos agora (").append(act.size()).append("): ");
              if (act.isEmpty()) {
                sb.append("nenhum");
              } else {
                boolean f = true;
                for (String a : act) {
                  Methods.M m = Methods.byId(a);
                  if (m == null) continue;
                  sb.append(f ? "" : ", ").append(m.label);
                  f = false;
                }
              }
              long last = p.getLong("tune_last", 0);
              if (last > 0) sb.append("\nÚltimo teste: ").append(new SimpleDateFormat("dd/MM HH:mm", Locale.US).format(new Date(last)));
              String rep = p.getString("tune_rep", "");
              if (!rep.isEmpty()) sb.append("\n\n").append(rep.trim());
              return sb.toString();
            }
          }
