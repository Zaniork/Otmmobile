            }

            /** Fecha processos em segundo plano de apps comuns (não mexe em apps de sistema puros). Rodar fora da thread principal. */
            static long clean(Context c, String why) {
              int prof = U.p(c).getInt("profile", 1);
              long before = U.mem(c)[0];
              ActivityManager am = (ActivityManager) c.getSystemService(Context.ACTIVITY_SERVICE);
              PackageManager pm = c.getPackageManager();
              Set<String> keep = protect(c, prof == 2 ? 3 : (prof == 1 ? 6 : 10));
              int n = 0;
              for (ApplicationInfo a : pm.getInstalledApplications(0)) {
                boolean sys = (a.flags & ApplicationInfo.FLAG_SYSTEM) != 0;
                boolean upd = (a.flags & ApplicationInfo.FLAG_UPDATED_SYSTEM_APP) != 0;
                if (sys && !upd) continue;
                if (keep.contains(a.packageName)) continue;
                if ((a.flags & ApplicationInfo.FLAG_STOPPED) != 0) continue;
                if (upd && pm.getLaunchIntentForPackage(a.packageName) == null) continue;
                try {
                  am.killBackgroundProcesses(a.packageName);
                  n++;
                } catch (Throwable t) {
                }
