            @Override
            public int onStartCommand(Intent i, int f, int id) {
              startForeground(1, notif("Turbo ativo", "Iniciando…"));
              String a = i == null ? null : i.getAction();
              if (A_STOP.equals(a)) {
                U.setEnabled(this, false);
                return START_NOT_STICKY;
              }
              if (!U.enabled(this)) {
                stopSelf();
