# =====================================================================
#  TURBO - Otimizador com IA local, ADB SEM FIO (sem PC), auto-testador de 34 metodos
#  ARQUIVO UNICO: salve como  .github/workflows/build.yml  no seu repositorio.
#  Ele cria o projeto Android inteiro sozinho, compila e publica o APK.
#  Baixe o APK em: aba "Releases" (direto, sem zip) ou em Actions > Artifacts.
# =====================================================================
name: Build Turbo APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Gerar projeto Android
        run: |
          cat > settings.gradle << 'EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories { google(); mavenCentral(); maven { url 'https://jitpack.io' } }
          }
          rootProject.name = "Turbo"
          include ':app'
          EOF_0
          cat > build.gradle << 'EOF_1'
          plugins { id 'com.android.application' version '8.1.4' apply false }
          EOF_1
          cat > gradle.properties << 'EOF_2'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=true
          android.nonTransitiveRClass=true
          EOF_2
          mkdir -p app
          cat > app/build.gradle << 'EOF_3'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.turbo.a03'
            compileSdk 34
            defaultConfig {
              applicationId "com.turbo.a03"
              minSdk 26
              targetSdk 33
              versionCode 1
              versionName "1.0"
            }
            buildTypes { release { minifyEnabled false } }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_1_8
              targetCompatibility JavaVersion.VERSION_1_8
            }
            lint { abortOnError false }
            packaging {
              resources {
                excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/DEPENDENCIES', 'META-INF/LICENSE*', 'META-INF/NOTICE*', 'META-INF/INDEX.LIST', 'META-INF/*.kotlin_module', 'META-INF/AL2.0', 'META-INF/LGPL2.1']
              }
            }
          }
          tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
          dependencies {
            implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
            implementation 'org.conscrypt:conscrypt-android:2.5.2'
            implementation 'org.bouncycastle:bcprov-jdk15to18:1.70'
            implementation 'org.bouncycastle:bcpkix-jdk15to18:1.70'
            implementation 'androidx.annotation:annotation:1.7.1'
          }
          EOF_3
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
            <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES"/>
            <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission"/>
            <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions"/>
            <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS" tools:ignore="ProtectedPermissions"/>
            <uses-permission android:name="android.permission.ACCESS_WIFI_STATE"/>
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE"/>
            <uses-permission android:name="android.permission.CHANGE_WIFI_MULTICAST_STATE"/>
            <application
                android:label="Turbo"
                android:icon="@drawable/ic_launcher"
                android:allowBackup="false"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true"
                  android:launchMode="singleTop"
                  android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|density|keyboard|keyboardHidden|uiMode|fontScale">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
              <service android:name=".OptService" android:exported="false"/>
              <receiver android:name=".BootReceiver" android:exported="true">
                <intent-filter>
                  <action android:name="android.intent.action.BOOT_COMPLETED"/>
                  <action android:name="android.intent.action.MY_PACKAGE_REPLACED"/>
