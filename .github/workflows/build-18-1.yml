          package com.turbo.a03;

          import android.content.Context;
          import android.content.SharedPreferences;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Calendar;
          import java.util.Iterator;
          import java.util.Locale;

          /**
           * IA local: regressão logística com aprendizado ONLINE (SGD).
           * Aprende a prever "vai faltar RAM nos próximos 3 min?" a partir de uso de RAM,
           * tendência, temperatura, hora do dia (padrão pessoal) e tela ligada/apagada.
           * Usa poucos KB de memória, então não gasta a RAM que quer economizar.
           */
          final class Brain {
            static final Brain I = new Brain();
            static final float[] PRIOR = {-6.5f, 7.5f, 0f, 0f, 0f, 0f};

            float[] w = PRIOR.clone();
            float[] hp = new float[24];
            long n = 0;
            float lastP = 0, lastU = -1, slope = 0, lastUsed = 0;
            long lastT = 0;
            boolean loaded = false;

            static final class S {
              final long t;
              final float[] x;

              S(long t, float[] x) {
                this.t = t;
                this.x = x;
              }
            }

            final ArrayList<S> buf = new ArrayList<>();
            final ArrayList<Long> ev = new ArrayList<>();

            static float sig(float z) {
              return (float) (1.0 / (1.0 + Math.exp(-Math.max(-30, Math.min(30, z)))));
            }

            static float dot(float[] a, float[] b) {
              float s = 0;
              for (int i = 0; i < a.length; i++) s += a[i] * b[i];
              return s;
            }

            synchronized void load(Context c) {
              if (loaded) return;
              loaded = true;
              Arrays.fill(hp, 0.7f);
              try {
                SharedPreferences p = U.p(c);
                String s = p.getString("ai_w", null);
                if (s != null) {
                  String[] a = s.split(",");
                  if (a.length == w.length) for (int i = 0; i < a.length; i++) w[i] = Float.parseFloat(a[i]);
                }
                String h = p.getString("ai_hp", null);
                if (h != null) {
                  String[] a = h.split(",");
                  if (a.length == 24) for (int i = 0; i < 24; i++) hp[i] = Float.parseFloat(a[i]);
                }
                n = p.getLong("ai_n", 0);
              } catch (Throwable t) {
                w = PRIOR.clone();
                Arrays.fill(hp, 0.7f);
              }
            }

            synchronized void save(Context c) {
              StringBuilder a = new StringBuilder(), b = new StringBuilder();
              for (int i = 0; i < w.length; i++) a.append(i > 0 ? "," : "").append(w[i]);
              for (int i = 0; i < 24; i++) b.append(i > 0 ? "," : "").append(hp[i]);
              U.p(c).edit().putString("ai_w", a.toString()).putString("ai_hp", b.toString()).putLong("ai_n", n).apply();
            }

            synchronized void reset(Context c) {
              w = PRIOR.clone();
              Arrays.fill(hp, 0.7f);
              n = 0;
              buf.clear();
              ev.clear();
              lastT = 0;
              lastU = -1;
              slope = 0;
              U.p(c).edit().remove("ai_w").remove("ai_hp").remove("ai_n").apply();
            }

            /** Chamado a cada ciclo do serviço. Retorna o risco (0..1) de falta de RAM em breve. */
            synchronized float step(Context c, boolean screenOn) {
              load(c);
              long[] m = U.mem(c);
              float u = 1f - (float) m[0] / Math.max(1L, m[1]);
              lastUsed = u;
              long now = System.currentTimeMillis();
              boolean event = m[2] == 1 || m[0] < Math.max(m[3] * 1.5f, m[1] * 0.10f);
              int hr = Calendar.getInstance().get(Calendar.HOUR_OF_DAY);
              hp[hr] = 0.95f * hp[hr] + 0.05f * u;
              if (lastT > 0 && now > lastT && lastU >= 0) {
                float per = Math.max((now - lastT) / 60000f, 0.05f);
                slope = 0.7f * slope + 0.3f * ((u - lastU) / per);
              }
              lastU = u;
              lastT = now;
              float sl = Math.max(-0.5f, Math.min(0.5f, slope)) * 4f;
              float[] x = {1f, u, sl, U.batt(c)[1] / 45f, hp[hr], screenOn ? 1f : 0f};
              float p = sig(dot(w, x));
              lastP = p;
              if (event) ev.add(now);
              buf.add(new S(now, x));
              final long H = 180000L;
              boolean trained = false;
              Iterator<S> it = buf.iterator();
              while (it.hasNext()) {
                S s = it.next();
                if (now - s.t < H) break;
                float y = 0;
                for (int k = 0; k < ev.size(); k++) {
                  long te = ev.get(k);
                  if (te > s.t && te <= s.t + H) {
                    y = 1;
                    break;
                  }
                }
                float pp = sig(dot(w, s.x));
                float g = (y - pp) * 0.03f;
                for (int i = 0; i < w.length; i++) {
                  w[i] = Math.max(-14f, Math.min(14f, w[i] + g * s.x[i]));
                }
                n++;
                trained = true;
                it.remove();
              }
              while (!ev.isEmpty() && now - ev.get(0) > 2 * H) ev.remove(0);
              if (trained && n % 10 == 0) save(c);
              return p;
            }

            synchronized String summary(Context c) {
              load(c);
              int hr = Calendar.getInstance().get(Calendar.HOUR_OF_DAY);
              return "🧠 IA local (aprende sozinha com seu uso)\n"
                  + "Amostras aprendidas: " + n + "\n"
                  + "Risco de faltar RAM agora: " + Math.round(lastP * 100) + "%\n"
                  + "Uso típico de RAM às " + hr + "h: " + Math.round(hp[hr] * 100) + "%\n"
                  + String.format(Locale.US, "Pesos: viés %.1f • RAM %.1f • tendência %.1f • calor %.1f", w[0], w[1], w[2], w[3]);
            }
          }
          EOF_9
          mkdir -p app/src/main/java/com/turbo/a03
          cat > app/src/main/java/com/turbo/a03/Adb.java << 'EOF_10'
          package com.turbo.a03;

          import android.content.Context;
          import android.content.SharedPreferences;
          import android.util.Base64;
          import java.io.ByteArrayOutputStream;
          import java.io.IOException;
          import java.io.InputStream;
          import java.io.OutputStream;
          import java.math.BigInteger;
          import java.net.ConnectException;
          import java.net.InetSocketAddress;
          import java.net.Socket;
          import java.nio.ByteBuffer;
          import java.nio.ByteOrder;
          import java.security.KeyFactory;
          import java.security.KeyPair;
          import java.security.KeyPairGenerator;
          import java.security.interfaces.RSAPrivateCrtKey;
          import java.security.interfaces.RSAPublicKey;
          import java.security.spec.PKCS8EncodedKeySpec;
          import java.security.spec.RSAPublicKeySpec;
          import javax.crypto.Cipher;

          /** Cliente ADB mínimo (protocolo adbd sobre TCP, autenticação RSA). Conecta em 127.0.0.1:porta. */
          final class Adb {
            static final int CNXN = 0x4e584e43, AUTH = 0x48545541, OPEN = 0x4e45504f,
                OKAY = 0x59414b4f, CLSE = 0x45534c43, WRTE = 0x45545257;
            static final byte[] SHA1_PREFIX = {0x30, 0x21, 0x30, 0x09, 0x06, 0x05, 0x2b, 0x0e, 0x03, 0x02, 0x1a, 0x05, 0x00, 0x04, 0x14};

            Socket sk;
            InputStream in;
            OutputStream out;
            int nextId = 1;
            KeyPair kp;

            static final class Msg {
              final int cmd, a0, a1;
              final byte[] d;

              Msg(int c, int a, int b, byte[] d) {
                this.cmd = c;
                this.a0 = a;
                this.a1 = b;
                this.d = d;
              }
            }

            static synchronized KeyPair keys(Context c) throws Exception {
              SharedPreferences p = U.p(c);
              String s = p.getString("adbkey", null);
              KeyFactory kf = KeyFactory.getInstance("RSA");
              if (s != null) {
                RSAPrivateCrtKey pr = (RSAPrivateCrtKey) kf.generatePrivate(new PKCS8EncodedKeySpec(Base64.decode(s, Base64.NO_WRAP)));
                RSAPublicKey pu = (RSAPublicKey) kf.generatePublic(new RSAPublicKeySpec(pr.getModulus(), pr.getPublicExponent()));
                return new KeyPair(pu, pr);
              }
              KeyPairGenerator g = KeyPairGenerator.getInstance("RSA");
              g.initialize(2048);
              KeyPair k = g.generateKeyPair();
              p.edit().putString("adbkey", Base64.encodeToString(k.getPrivate().getEncoded(), Base64.NO_WRAP)).apply();
              return k;
            }

            void send(int cmd, int a0, int a1, byte[] data) throws IOException {
              int len = data == null ? 0 : data.length;
              int sum = 0;
              for (int i = 0; i < len; i++) sum += (data[i] & 0xff);
              ByteBuffer b = ByteBuffer.allocate(24 + len).order(ByteOrder.LITTLE_ENDIAN);
              b.putInt(cmd).putInt(a0).putInt(a1).putInt(len).putInt(sum).putInt(cmd ^ 0xffffffff);
              if (len > 0) b.put(data);
              out.write(b.array());
              out.flush();
            }

            byte[] readN(int n) throws IOException {
              byte[] b = new byte[n];
              int o = 0;
              while (o < n) {
                int r = in.read(b, o, n - o);
                if (r < 0) throw new IOException("conexão encerrada pelo adbd");
                o += r;
              }
              return b;
            }

            Msg recv() throws IOException {
              ByteBuffer h = ByteBuffer.wrap(readN(24)).order(ByteOrder.LITTLE_ENDIAN);
              int cmd = h.getInt(), a0 = h.getInt(), a1 = h.getInt(), len = h.getInt();
              if (len < 0 || len > (1 << 20)) throw new IOException("pacote inválido");
              byte[] d = len > 0 ? readN(len) : new byte[0];
              return new Msg(cmd, a0, a1, d);
            }

            byte[] sign(byte[] token) throws Exception {
              byte[] t = new byte[256];
              t[0] = 0;
              t[1] = 1;
              int padEnd = 256 - 1 - SHA1_PREFIX.length - token.length;
              for (int i = 2; i < padEnd; i++) t[i] = (byte) 0xff;
              t[padEnd] = 0;
              System.arraycopy(SHA1_PREFIX, 0, t, padEnd + 1, SHA1_PREFIX.length);
              System.arraycopy(token, 0, t, padEnd + 1 + SHA1_PREFIX.length, token.length);
              Cipher c = Cipher.getInstance("RSA/ECB/NoPadding");
              c.init(Cipher.ENCRYPT_MODE, kp.getPrivate());
              return c.doFinal(t);
            }

            byte[] pub() throws Exception {
              RSAPublicKey k = (RSAPublicKey) kp.getPublic();
              BigInteger n = k.getModulus();
              BigInteger r32 = BigInteger.ONE.shiftLeft(32);
              int n0inv = n.mod(r32).modInverse(r32).negate().mod(r32).intValue();
              BigInteger rr = BigInteger.ONE.shiftLeft(4096).mod(n);
              ByteBuffer b = ByteBuffer.allocate(4 + 4 + 256 + 256 + 4).order(ByteOrder.LITTLE_ENDIAN);
              b.putInt(64);
              b.putInt(n0inv);
              for (int i = 0; i < 64; i++) b.putInt(n.shiftRight(32 * i).intValue());
              for (int i = 0; i < 64; i++) b.putInt(rr.shiftRight(32 * i).intValue());
              b.putInt(k.getPublicExponent().intValue());
              String s = Base64.encodeToString(b.array(), Base64.NO_WRAP) + " turbo@a03\u0000";
              return s.getBytes("ISO-8859-1");
            }

            static Adb connect(Context c) throws Exception {
              int port = U.p(c).getInt("adbport", 5555);
              Adb a = new Adb();
              a.kp = keys(c);
              a.sk = new Socket();
              a.sk.connect(new InetSocketAddress("127.0.0.1", port), 3000);
              a.sk.setSoTimeout(90000);
              a.in = a.sk.getInputStream();
              a.out = a.sk.getOutputStream();
              a.send(CNXN, 0x01000000, 4096, "host::\u0000".getBytes("ISO-8859-1"));
              boolean sig = false, pk = false;
              while (true) {
                Msg m = a.recv();
                if (m.cmd == CNXN) break;
                if (m.cmd == AUTH && m.a0 == 1) {
                  if (!sig) {
                    a.send(AUTH, 2, 0, a.sign(m.d));
                    sig = true;
                  } else if (!pk) {
                    a.send(AUTH, 3, 0, a.pub());
                    pk = true;
                  } else {
                    throw new IOException("autorização negada no celular");
                  }
                } else {
                  throw new IOException("resposta inesperada do adbd");
                }
              }
              return a;
            }

            String shell(String cmd, int timeoutMs) throws Exception {
              sk.setSoTimeout(timeoutMs);
              int lid = nextId++;
              send(OPEN, lid, 0, ("shell:" + cmd + "\u0000").getBytes("UTF-8"));
              int rid = 0;
              ByteArrayOutputStream o = new ByteArrayOutputStream();
              while (true) {
                Msg m = recv();
                if (m.cmd == OKAY) {
                  rid = m.a0;
                } else if (m.cmd == WRTE) {
                  o.write(m.d);
                  send(OKAY, lid, m.a0, null);
                } else if (m.cmd == CLSE) {
                  if (rid == 0) throw new IOException("comando recusado");
                  break;
                }
              }
              return o.toString("UTF-8");
            }

            void close() {
              try {
                sk.close();
              } catch (Throwable t) {
              }
            }

            /** Usa a Depuração sem fio (sem PC) quando já pareada; senão, o modo antigo (adb tcpip). */
            static String run(Context c, int timeoutMs, String... cmds) {
              if (WifiAdb.supported() && WifiAdb.paired(c)) {
                String w = WifiAdb.run(c, timeoutMs, cmds);
                if (ok(w) || !U.p(c).getBoolean("legacy_ok", false)) return w;
              }
              return runLegacy(c, timeoutMs, cmds);
