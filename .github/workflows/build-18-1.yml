            /** Ordem de teste: o que mais deu certo neste aparelho primeiro; ações pontuais por último. */
            static ArrayList<M> order(Context c, Set<String> active) {
              SharedPreferences p = U.p(c);
              Set<String> un = p.getStringSet("tune_unsup", new HashSet<String>());
              final HashMap<String, Float> sc = new HashMap<>();
              Random rnd = new Random();
              ArrayList<M> a = new ArrayList<>(), b = new ArrayList<>();
              for (M m : ALL) {
                if (un.contains(m.id) || active.contains(m.id)) continue;
                int w = p.getInt("ts_w_" + m.id, 0), t = p.getInt("ts_t_" + m.id, 0);
                sc.put(m.id, (w + 1f) / (t + 2f) + rnd.nextFloat() * 0.15f);
                if (m.action()) b.add(m);
                else a.add(m);
              }
              Comparator<M> cmp = new Comparator<M>() {
                public int compare(M x, M y) {
                  return Float.compare(sc.get(y.id), sc.get(x.id));
                }
              };
              Collections.sort(a, cmp);
              Collections.sort(b, cmp);
              a.addAll(b);
              return a;
            }
