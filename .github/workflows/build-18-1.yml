              PendingIntent pt = PendingIntent.getService(this, 1, new Intent(this, OptService.class).setAction(A_TURBO), PendingIntent.FLAG_IMMUTABLE);
              PendingIntent ps = PendingIntent.getService(this, 2, new Intent(this, OptService.class).setAction(A_STOP), PendingIntent.FLAG_IMMUTABLE);
              return new Notification.Builder(this, CH)
                  .setSmallIcon(R.drawable.ic_bolt)
                  .setContentTitle(t)
                  .setContentText(s)
                  .setStyle(new Notification.BigTextStyle().bigText(s))
                  .setOngoing(true)
                  .setOnlyAlertOnce(true)
                  .setContentIntent(open)
                  .addAction(new Notification.Action.Builder(Icon.createWithResource(this, R.drawable.ic_bolt), "Turbo", pt).build())
                  .addAction(new Notification.Action.Builder(Icon.createWithResource(this, R.drawable.ic_bolt), "Desativar", ps).build())
                  .build();
            }

            @Override
            public IBinder onBind(Intent i) {
              return null;
            }

            @Override
            public void onCreate() {
              super.onCreate();
              pw = (PowerManager) getSystemService(POWER_SERVICE);
              NotificationChannel ch = new NotificationChannel(CH, "Turbo", NotificationManager.IMPORTANCE_LOW);
              ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(ch);
              ht = new HandlerThread("turbo");
              ht.start();
              h = new Handler(ht.getLooper());
              try {
                registerReceiver(scr, new IntentFilter(Intent.ACTION_SCREEN_OFF));
