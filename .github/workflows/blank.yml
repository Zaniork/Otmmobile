              PendingIntent ps = PendingIntent.getService(this, 2, new Intent(this, OptService.class).setAction(A_STOP), PendingIntent.FLAG_IMMUTABLE);
              return new Notification.Builder(this, CH)
                  .setSmallIcon(R.drawable.ic_bolt)
                  .setContentTitle(t)
                  .setContentText(s)
                  .setStyle(new Notification.BigTextStyle().bigText(s))
                  .setOngoing(true)
                  .setOnlyAlertOnce(true)
                  .setContentIntent(open)
                  .addAction(new Notification.Action.Builder(Icon.createWithResource(this, R.drawable.ic_bolt), "Turbo", pt).build())
                  .addAction(new Notification.Action.Builder(Icon.createWithResource(this, R.drawable.ic_bolt), "Desativar", ps).build())
                  .build();
            }

            @Override
            public IBinder onBind(Intent i) {
              return null;
            }

            @Override
            public void onCreate() {
              super.onCreate();
              pw = (PowerManager) getSystemService(POWER_SERVICE);
              NotificationChannel ch = new NotificationChannel(CH, "Turbo", NotificationManager.IMPORTANCE_LOW);
              ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).createNotificationChannel(ch);
              ht = new HandlerThread("turbo");
              ht.start();
              h = new Handler(ht.getLooper());
              try {
                registerReceiver(scr, new IntentFilter(Intent.ACTION_SCREEN_OFF));
                regd = true;
              } catch (Throwable t) {
              }
              running = true;
            }

            @Override
            public int onStartCommand(Intent i, int f, int id) {
              startForeground(1, notif("Turbo ativo", "Iniciando…"));
              String a = i == null ? null : i.getAction();
              if (A_STOP.equals(a)) {
                U.setEnabled(this, false);
                return START_NOT_STICKY;
              }
              if (!U.enabled(this)) {
                stopSelf();
                return START_NOT_STICKY;
              }
              if (A_TURBO.equals(a)) {
                h.post(new Runnable() {
                  public void run() {
                    doClean("notificação");
                  }
                });
              }
              h.removeCallbacks(tick);
              h.post(tick);
              return START_STICKY;
            }

            @Override
            public void onTrimMemory(int level) {
              super.onTrimMemory(level);
              if ((level == 10 || level == 15) && h != null) {
                h.post(new Runnable() {
                  public void run() {
                    if (SystemClock.elapsedRealtime() - lastClean > 30000) doClean("sistema pediu RAM");
                  }
                });
              }
            }

            @Override
            public void onTaskRemoved(Intent r) {
              if (U.enabled(this)) {
                try {
                  AlarmManager am = (AlarmManager) getSystemService(ALARM_SERVICE);
                  PendingIntent pi = PendingIntent.getForegroundService(this, 9, new Intent(this, OptService.class),
                      PendingIntent.FLAG_IMMUTABLE | PendingIntent.FLAG_ONE_SHOT);
                  am.set(AlarmManager.ELAPSED_REALTIME, SystemClock.elapsedRealtime() + 3000, pi);
                } catch (Throwable t) {
                }
              }
            }

            @Override
            public void onDestroy() {
              running = false;
              try {
                if (regd) unregisterReceiver(scr);
              } catch (Throwable t) {
              }
              if (h != null) h.removeCallbacksAndMessages(null);
              if (ht != null) ht.quitSafely();
              stopForeground(true);
              super.onDestroy();
            }
          }
