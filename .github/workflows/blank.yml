              c2.addView(sw);
              c2.addView(text("Desligue aqui ou no botão \"Desativar\" da notificação. Ao desligar, o serviço e a inicialização automática são cancelados.", 12, DIM, false));
              TextView pt = text("Perfil da IA:", 13, TXT, true);
              pt.setPadding(0, dp(10), 0, 0);
              c2.addView(pt);
              RadioGroup rg = new RadioGroup(this);
              String[] pn = {"Economia (limpa pouco)", "Equilibrado", "Máximo (agressivo)"};
              for (int i = 0; i < 3; i++) {
                RadioButton rb = new RadioButton(this);
                rb.setText(pn[i]);
                rb.setTextColor(TXT);
                rb.setId(100 + i);
                rg.addView(rb);
              }
              rg.check(100 + U.p(this).getInt("profile", 1));
              rg.setOnCheckedChangeListener(new RadioGroup.OnCheckedChangeListener() {
                public void onCheckedChanged(RadioGroup g, int id) {
                  U.p(MainActivity.this).edit().putInt("profile", id - 100).apply();
