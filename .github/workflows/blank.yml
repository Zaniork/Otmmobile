                cached(c, 0);
              } else if (prof == 1) {
                anim(c, "0.5");
                cached(c, 24);
              } else {
                anim(c, "0.25");
                cached(c, 16);
              }
              U.log("Perfil " + new String[]{"Economia", "Equilibrado", "Máximo"}[prof] + " aplicado");
            }

            static void grantSelf(Context c) {
              String me = c.getPackageName();
              String r = Adb.run(c, 20000,
                  "pm grant " + me + " android.permission.WRITE_SECURE_SETTINGS",
                  "pm grant " + me + " android.permission.POST_NOTIFICATIONS",
                  "appops set " + me + " GET_USAGE_STATS allow",
                  "appops set " + me + " RUN_ANY_IN_BACKGROUND allow",
                  "dumpsys deviceidle whitelist +" + me);
              U.log("Permissões automáticas: " + brief(r));
            }

            static void trimCaches(Context c) {
              long before = U.disk()[0];
              String r = Adb.run(c, 120000, "pm trim-caches 128G");
              long freed = U.disk()[0] - before;
              U.log("Caches limpos: " + (freed > 0 ? U.mb(freed) + " liberados" : brief(r)));
            }

            static void dexopt(Context c) {
