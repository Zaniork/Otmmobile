          package com.turbo.a03;

          import android.content.Context;
          import android.content.SharedPreferences;
          import java.util.ArrayList;
          import java.util.Arrays;
          import java.util.Calendar;
          import java.util.Iterator;
          import java.util.Locale;

          /**
           * IA local: regressão logística com aprendizado ONLINE (SGD).
           * Aprende a prever "vai faltar RAM nos próximos 3 min?" a partir de uso de RAM,
           * tendência, temperatura, hora do dia (padrão pessoal) e tela ligada/apagada.
           * Usa poucos KB de memória, então não gasta a RAM que quer economizar.
           */
          final class Brain {
            static final Brain I = new Brain();
            static final float[] PRIOR = {-6.5f, 7.5f, 0f, 0f, 0f, 0f};

            float[] w = PRIOR.clone();
            float[] hp = new float[24];
            long n = 0;
            float lastP = 0, lastU = -1, slope = 0, lastUsed = 0;
            long lastT = 0;
            boolean loaded = false;

            static final class S {
              final long t;
              final float[] x;

              S(long t, float[] x) {
                this.t = t;
                this.x = x;
              }
            }

            final ArrayList<S> buf = new ArrayList<>();
            final ArrayList<Long> ev = new ArrayList<>();

            static float sig(float z) {
              return (float) (1.0 / (1.0 + Math.exp(-Math.max(-30, Math.min(30, z)))));
            }

            static float dot(float[] a, float[] b) {
              float s = 0;
              for (int i = 0; i < a.length; i++) s += a[i] * b[i];
              return s;
            }

            synchronized void load(Context c) {
              if (loaded) return;
              loaded = true;
              Arrays.fill(hp, 0.7f);
              try {
                SharedPreferences p = U.p(c);
                String s = p.getString("ai_w", null);
                if (s != null) {
                  String[] a = s.split(",");
                  if (a.length == w.length) for (int i = 0; i < a.length; i++) w[i] = Float.parseFloat(a[i]);
                }
                String h = p.getString("ai_hp", null);
                if (h != null) {
                  String[] a = h.split(",");
                  if (a.length == 24) for (int i = 0; i < 24; i++) hp[i] = Float.parseFloat(a[i]);
                }
                n = p.getLong("ai_n", 0);
              } catch (Throwable t) {
                w = PRIOR.clone();
                Arrays.fill(hp, 0.7f);
              }
            }

            synchronized void save(Context c) {
              StringBuilder a = new StringBuilder(), b = new StringBuilder();
              for (int i = 0; i < w.length; i++) a.append(i > 0 ? "," : "").append(w[i]);
              for (int i = 0; i < 24; i++) b.append(i > 0 ? "," : "").append(hp[i]);
              U.p(c).edit().putString("ai_w", a.toString()).putString("ai_hp", b.toString()).putLong("ai_n", n).apply();
            }

            synchronized void reset(Context c) {
              w = PRIOR.clone();
              Arrays.fill(hp, 0.7f);
              n = 0;
              buf.clear();
              ev.clear();
              lastT = 0;
              lastU = -1;
              slope = 0;
              U.p(c).edit().remove("ai_w").remove("ai_hp").remove("ai_n").apply();
            }

            /** Chamado a cada ciclo do serviço. Retorna o risco (0..1) de falta de RAM em breve. */
            synchronized float step(Context c, boolean screenOn) {
              load(c);
              long[] m = U.mem(c);
              float u = 1f - (float) m[0] / Math.max(1L, m[1]);
              lastUsed = u;
              long now = System.currentTimeMillis();
              boolean event = m[2] == 1 || m[0] < Math.max(m[3] * 1.5f, m[1] * 0.10f);
              int hr = Calendar.getInstance().get(Calendar.HOUR_OF_DAY);
              hp[hr] = 0.95f * hp[hr] + 0.05f * u;
              if (lastT > 0 && now > lastT && lastU >= 0) {
                float per = Math.max((now - lastT) / 60000f, 0.05f);
                slope = 0.7f * slope + 0.3f * ((u - lastU) / per);
              }
              lastU = u;
              lastT = now;
              float sl = Math.max(-0.5f, Math.min(0.5f, slope)) * 4f;
              float[] x = {1f, u, sl, U.batt(c)[1] / 45f, hp[hr], screenOn ? 1f : 0f};
              float p = sig(dot(w, x));
              lastP = p;
              if (event) ev.add(now);
              buf.add(new S(now, x));
              final long H = 180000L;
              boolean trained = false;
              Iterator<S> it = buf.iterator();
              while (it.hasNext()) {
                S s = it.next();
                if (now - s.t < H) break;
                float y = 0;
                for (int k = 0; k < ev.size(); k++) {
                  long te = ev.get(k);
                  if (te > s.t && te <= s.t + H) {
                    y = 1;
                    break;
                  }
                }
                float pp = sig(dot(w, s.x));
                float g = (y - pp) * 0.03f;
                for (int i = 0; i < w.length; i++) {
                  w[i] = Math.max(-14f, Math.min(14f, w[i] + g * s.x[i]));
                }
                n++;
                trained = true;
                it.remove();
              }
              while (!ev.isEmpty() && now - ev.get(0) > 2 * H) ev.remove(0);
              if (trained && n % 10 == 0) save(c);
              return p;
            }

            synchronized String summary(Context c) {
              load(c);
              int hr = Calendar.getInstance().get(Calendar.HOUR_OF_DAY);
              return "🧠 IA local (aprende sozinha com seu uso)\n"
                  + "Amostras aprendidas: " + n + "\n"
                  + "Risco de faltar RAM agora: " + Math.round(lastP * 100) + "%\n"
                  + "Uso típico de RAM às " + hr + "h: " + Math.round(hp[hr] * 100) + "%\n"
                  + String.format(Locale.US, "Pesos: viés %.1f • RAM %.1f • tendência %.1f • calor %.1f", w[0], w[1], w[2], w[3]);
            }
          }
