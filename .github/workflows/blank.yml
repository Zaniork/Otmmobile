          public class OptService extends Service {
            static final String A_TURBO = "turbo", A_STOP = "stop", CH = "turbo";
            static volatile boolean running = false;
            static final float[] THR = {0.65f, 0.45f, 0.30f};
            static final long[] CD = {300000L, 120000L, 60000L};
            static final float[] HARD = {0.92f, 0.88f, 0.82f};

            HandlerThread ht;
            Handler h;
