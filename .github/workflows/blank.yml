              });
              c2.addView(rg);
              btn(c2, "Aplicar perfil via ADB (animações + processos)", false, new View.OnClickListener() {
                public void onClick(View v) {
                  bg(new Runnable() {
                    public void run() {
                      Opt.applyProfile(MainActivity.this, U.p(MainActivity.this).getInt("profile", 1));
                      toast("Perfil aplicado");
                    }
                  });
                }
              });

              // ---- PERMISSOES ----
              LinearLayout c3 = card("Permissões (para funcionar sempre)");
              btn(c3, "1) Acesso de uso (IA aprende seus apps)", false, new View.OnClickListener() {
                public void onClick(View v) {
                  startActivity(new Intent(Settings.ACTION_USAGE_ACCESS_SETTINGS));
                }
              });
              btn(c3, "2) Ignorar otimização de bateria", false, new View.OnClickListener() {
                public void onClick(View v) {
                  try {
                    startActivity(new Intent(Settings.ACTION_REQUEST_IGNORE_BATTERY_OPTIMIZATIONS, Uri.parse("package:" + getPackageName())));
                  } catch (Throwable t) {
                    startActivity(new Intent(Settings.ACTION_IGNORE_BATTERY_OPTIMIZATION_SETTINGS));
                  }
                }
              });
              btn(c3, "3) Permitir notificações", false, new View.OnClickListener() {
                public void onClick(View v) {
                  askNotif();
                }
              });
              btn(c3, "Apps protegidos (nunca fechar)…", false, new View.OnClickListener() {
                public void onClick(View v) {
                  pickApps("Proteger da limpeza", "whitelist", new Runnable() {
                    public void run() {
                      toast("Salvo");
                    }
                  });
                }
              });

              // ---- ADB ----
              LinearLayout c4 = card("ADB (o app conversa com o próprio celular)");
              TextView how = text("Uma vez, com o celular no PC por USB:\n   adb tcpip 5555\nDepois toque em Conectar abaixo e aceite \"Permitir depuração USB\" (marque sempre permitir). Reiniciar o celular desfaz o tcpip.\n\nOpcional, concede permissão extra:\n   adb shell pm grant com.turbo.a03 android.permission.WRITE_SECURE_SETTINGS", 12, DIM, false);
              how.setTextIsSelectable(true);
              c4.addView(how);
              LinearLayout pr = row(c4);
              pr.setGravity(Gravity.CENTER_VERTICAL);
              pr.addView(text("Porta:", 13, TXT, false));
              etPort = new EditText(this);
              etPort.setInputType(InputType.TYPE_CLASS_NUMBER);
              etPort.setText(String.valueOf(U.p(this).getInt("adbport", 5555)));
              etPort.setTextColor(TXT);
              pr.addView(etPort, new LinearLayout.LayoutParams(dp(100), -2));
              btn(c4, "Conectar / autorizar ADB", true, new View.OnClickListener() {
                public void onClick(View v) {
                  try {
                    U.p(MainActivity.this).edit().putInt("adbport", Integer.parseInt(etPort.getText().toString().trim())).apply();
                  } catch (Throwable t) {
                  }
                  toast("Conectando… aceite o aviso na tela se aparecer");
                  bg(new Runnable() {
                    public void run() {
                      String r = Adb.run(MainActivity.this, 90000, "id");
                      boolean ok = Adb.ok(r);
                      U.p(MainActivity.this).edit().putBoolean("adb_ok", ok).apply();
                      U.log(ok ? "ADB conectado: " + Opt.brief(r) : Opt.brief(r));
                      toast(ok ? "ADB conectado!" : Opt.brief(r));
                    }
                  });
                }
              });
              btn(c4, "Auto-conceder permissões ao app", false, new View.OnClickListener() {
                public void onClick(View v) {
                  bg(new Runnable() {
                    public void run() {
                      Opt.grantSelf(MainActivity.this);
                      toast("Pronto, veja o log");
                    }
                  });
                }
              });

              // ---- FERRAMENTAS ----
              LinearLayout c5 = card("Ferramentas ADB");
              c5.addView(text("Resolução da tela (menos pixels = mais rápido). Pede confirmação e volta sozinha em 15 s se você não confirmar.", 12, DIM, false));
              LinearLayout r1 = row(c5);
              final int[] pcts = {100, 85, 75, 60};
              for (int i = 0; i < pcts.length; i++) {
                final int pc = pcts[i];
                small(r1, pc + "%", new View.OnClickListener() {
                  public void onClick(View v) {
                    bg(new Runnable() {
                      public void run() {
                        boolean ok = Opt.setRes(MainActivity.this, pc);
                        if (ok && pc < 100) {
                          runOnUiThread(new Runnable() {
                            public void run() {
                              confirmRes();
                            }
                          });
                        } else if (!ok) {
                          toast("Falhou. Conecte o ADB primeiro.");
                        }
                      }
                    });
                  }
                });
              }
              TextView ta = text("Animações do sistema:", 13, TXT, true);
              ta.setPadding(0, dp(10), 0, 0);
              c5.addView(ta);
              LinearLayout r2 = row(c5);
              final String[] av = {"1.0", "0.5", "0.25", "0"};
              final String[] al = {"1x", "0.5x", "0.25x", "Off"};
              for (int i = 0; i < av.length; i++) {
                final String v1 = av[i];
                small(r2, al[i], new View.OnClickListener() {
                  public void onClick(View v) {
                    bg(new Runnable() {
                      public void run() {
                        Opt.anim(MainActivity.this, v1);
                        toast("Animações " + v1 + "x");
                      }
                    });
                  }
                });
              }
              TextView tc = text("Máx. de apps mantidos em cache (padrão do Android: 32):", 13, TXT, true);
              tc.setPadding(0, dp(10), 0, 0);
              c5.addView(tc);
              LinearLayout r3 = row(c5);
              final int[] cv = {0, 24, 16, 8};
              final String[] cl = {"Padrão", "24", "16", "8"};
              for (int i = 0; i < cv.length; i++) {
                final int n = cv[i];
                small(r3, cl[i], new View.OnClickListener() {
                  public void onClick(View v) {
                    bg(new Runnable() {
                      public void run() {
                        Opt.cached(MainActivity.this, n);
                        toast("Aplicado");
                      }
                    });
                  }
                });
              }
              btn(c5, "Limpar cache de todos os apps", false, new View.OnClickListener() {
                public void onClick(View v) {
                  bg(new Runnable() {
                    public void run() {
                      Opt.trimCaches(MainActivity.this);
                      toast("Veja o log");
                    }
                  });
                }
              });
              btn(c5, "Compilar apps (abrem mais rápido)", false, new View.OnClickListener() {
                public void onClick(View v) {
                  bg(new Runnable() {
                    public void run() {
                      Opt.dexopt(MainActivity.this);
                      toast("Compilação terminou");
                    }
                  });
                }
              });
              btn(c5, "Restringir apps em segundo plano…", false, new View.OnClickListener() {
                public void onClick(View v) {
                  final Set<String> old = new HashSet<String>(U.p(MainActivity.this).getStringSet("restricted", new HashSet<String>()));
                  pickApps("Bloquear segundo plano", "restricted", new Runnable() {
                    public void run() {
                      final Set<String> nw = new HashSet<String>(U.p(MainActivity.this).getStringSet("restricted", new HashSet<String>()));
                      bg(new Runnable() {
                        public void run() {
                          Opt.applyRestrict(MainActivity.this, old, nw);
                          toast("Aplicado");
                        }
                      });
                    }
                  });
                }
              });
              btn(c5, "↩ RESTAURAR TUDO ao padrão", false, new View.OnClickListener() {
                public void onClick(View v) {
                  bg(new Runnable() {
                    public void run() {
                      Opt.restoreAll(MainActivity.this);
                      toast("Tudo restaurado");
                    }
                  });
                }
              });

              // ---- IA ----
              LinearLayout c6 = card("IA local");
              tvAi = text("", 12, TXT, false);
              c6.addView(tvAi);
              btn(c6, "Resetar aprendizado da IA", false, new View.OnClickListener() {
                public void onClick(View v) {
                  Brain.I.reset(MainActivity.this);
                  toast("IA resetada");
                }
              });

              // ---- LOG ----
              LinearLayout c7 = card("Log");
              tvLog = text("", 11, DIM, false);
              tvLog.setTypeface(Typeface.MONOSPACE);
              tvLog.setTextIsSelectable(true);
              c7.addView(tvLog);

              if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                askNotif();
              }
              if (U.enabled(this) && !OptService.running) U.setEnabled(this, true);
            }

            void askNotif() {
              if (Build.VERSION.SDK_INT >= 33 && checkSelfPermission("android.permission.POST_NOTIFICATIONS") != PackageManager.PERMISSION_GRANTED) {
                requestPermissions(new String[]{"android.permission.POST_NOTIFICATIONS"}, 1);
              }
            }

            void confirmRes() {
              final AlertDialog[] d = new AlertDialog[1];
              revertTask = new Runnable() {
                public void run() {
                  bg(new Runnable() {
                    public void run() {
                      Opt.revertRes(MainActivity.this);
                    }
                  });
                  try {
                    if (d[0] != null) d[0].dismiss();
                  } catch (Throwable t) {
                  }
                }
              };
              d[0] = new AlertDialog.Builder(this)
                  .setTitle("Manter esta resolução?")
                  .setMessage("Se você não confirmar em 15 segundos, volta ao normal sozinha.")
                  .setCancelable(false)
                  .setPositiveButton("Manter", new android.content.DialogInterface.OnClickListener() {
                    public void onClick(android.content.DialogInterface x, int w) {
                      ui.removeCallbacks(revertTask);
                      Opt.keepRes(MainActivity.this);
                    }
                  })
                  .setNegativeButton("Reverter", new android.content.DialogInterface.OnClickListener() {
                    public void onClick(android.content.DialogInterface x, int w) {
                      ui.removeCallbacks(revertTask);
                      bg(new Runnable() {
                        public void run() {
                          Opt.revertRes(MainActivity.this);
                        }
                      });
                    }
                  })
                  .show();
              ui.postDelayed(revertTask, 15000);
            }

            void pickApps(String title, final String key, final Runnable after) {
              final PackageManager pm = getPackageManager();
              List<ApplicationInfo> l = pm.getInstalledApplications(0);
              Collections.sort(l, new java.util.Comparator<ApplicationInfo>() {
                public int compare(ApplicationInfo a, ApplicationInfo b) {
                  return pm.getApplicationLabel(a).toString().compareToIgnoreCase(pm.getApplicationLabel(b).toString());
                }
              });
              Set<String> cur = new HashSet<String>(U.p(this).getStringSet(key, new HashSet<String>()));
              final ArrayList<String> pk = new ArrayList<>();
              ArrayList<String> lb = new ArrayList<>();
              for (ApplicationInfo a : l) {
                boolean sys = (a.flags & ApplicationInfo.FLAG_SYSTEM) != 0 && (a.flags & ApplicationInfo.FLAG_UPDATED_SYSTEM_APP) == 0;
                if (sys || a.packageName.equals(getPackageName()) || pm.getLaunchIntentForPackage(a.packageName) == null) continue;
                pk.add(a.packageName);
                lb.add(pm.getApplicationLabel(a).toString());
              }
              final boolean[] ch = new boolean[pk.size()];
              for (int i = 0; i < ch.length; i++) ch[i] = cur.contains(pk.get(i));
              new AlertDialog.Builder(this)
                  .setTitle(title)
                  .setMultiChoiceItems(lb.toArray(new String[0]), ch, new android.content.DialogInterface.OnMultiChoiceClickListener() {
                    public void onClick(android.content.DialogInterface d, int i, boolean on) {
                      ch[i] = on;
                    }
                  })
                  .setPositiveButton("OK", new android.content.DialogInterface.OnClickListener() {
                    public void onClick(android.content.DialogInterface d, int w) {
                      HashSet<String> n = new HashSet<>();
                      for (int i = 0; i < ch.length; i++) if (ch[i]) n.add(pk.get(i));
                      U.p(MainActivity.this).edit().putStringSet(key, n).apply();
                      after.run();
                    }
                  })
                  .setNegativeButton("Cancelar", null)
                  .show();
            }

            void upd() {
              long[] m = U.mem(this);
              long[] d = U.disk();
              float[] b = U.batt(this);
              tvStat.setText("RAM livre: " + U.mb(m[0]) + " de " + U.mb(m[1]) + " (" + Math.round(100f * m[0] / Math.max(1L, m[1])) + "%)\n"
                  + "Armazenamento livre: " + U.mb(d[0]) + " de " + U.mb(d[1]) + "\n"
                  + "Bateria: " + Math.round(b[0]) + "% • " + b[1] + " °C" + (b[2] > 0 ? " (carregando)" : "") + "\n"
                  + "RAM liberada pelo app (total): " + U.mb(U.p(this).getLong("freed_total", 0)));
              boolean bat = false;
              try {
                bat = ((PowerManager) getSystemService(POWER_SERVICE)).isIgnoringBatteryOptimizations(getPackageName());
              } catch (Throwable t) {
              }
              tvSvc.setText("Serviço: " + (OptService.running ? "ATIVO" : "desativado")
                  + "  •  ADB: " + (U.p(this).getBoolean("adb_ok", false) ? "autorizado" : "não conectado")
                  + "\nAcesso de uso: " + (Opt.hasUsage(this) ? "ok" : "falta")
                  + "  •  Bateria irrestrita: " + (bat ? "ok" : "falta"));
              tvAi.setText(Brain.I.summary(this));
              tvLog.setText(U.logText());
            }

            final Runnable refresh = new Runnable() {
              public void run() {
                try {
                  upd();
                } catch (Throwable t) {
                }
                ui.postDelayed(this, 2000);
              }
            };

            @Override
            protected void onResume() {
              super.onResume();
              sw.setChecked(U.enabled(this));
              ui.post(refresh);
            }

            @Override
            protected void onPause() {
              super.onPause();
              ui.removeCallbacks(refresh);
            }
          }
