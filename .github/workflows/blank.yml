          final class Opt {
            static String brief(String r) {
              r = r.trim().replace('\n', ' ');
              if (r.isEmpty()) return "ok";
              return r.length() > 90 ? r.substring(0, 90) + "…" : r;
            }

            static boolean hasUsage(Context c) {
              try {
                AppOpsManager a = (AppOpsManager) c.getSystemService(Context.APP_OPS_SERVICE);
                return a.checkOpNoThrow(AppOpsManager.OPSTR_GET_USAGE_STATS, Process.myUid(), c.getPackageName()) == AppOpsManager.MODE_ALLOWED;
              } catch (Throwable t) {
                return false;
              }
            }

            /** Apps que NUNCA são fechados: launcher, teclado, telefone, SMS, os que você usa mais e os usados há pouco. */
            static Set<String> protect(Context c, int top) {
              HashSet<String> s = new HashSet<>();
              s.add(c.getPackageName());
              PackageManager pm = c.getPackageManager();
              try {
                ResolveInfo r = pm.resolveActivity(new Intent(Intent.ACTION_MAIN).addCategory(Intent.CATEGORY_HOME), PackageManager.MATCH_DEFAULT_ONLY);
                if (r != null && r.activityInfo != null) s.add(r.activityInfo.packageName);
              } catch (Throwable t) {
              }
              try {
                String ime = Settings.Secure.getString(c.getContentResolver(), Settings.Secure.DEFAULT_INPUT_METHOD);
                if (ime != null && ime.indexOf('/') > 0) s.add(ime.substring(0, ime.indexOf('/')));
              } catch (Throwable t) {
              }
              try {
                TelecomManager tm = (TelecomManager) c.getSystemService(Context.TELECOM_SERVICE);
                String d = tm.getDefaultDialerPackage();
                if (d != null) s.add(d);
              } catch (Throwable t) {
              }
              try {
                String sm = Telephony.Sms.getDefaultSmsPackage(c);
                if (sm != null) s.add(sm);
              } catch (Throwable t) {
              }
              s.addAll(U.p(c).getStringSet("whitelist", new HashSet<String>()));
              if (hasUsage(c)) {
                try {
                  UsageStatsManager u = (UsageStatsManager) c.getSystemService(Context.USAGE_STATS_SERVICE);
                  long now = System.currentTimeMillis();
                  List<UsageStats> l = u.queryUsageStats(UsageStatsManager.INTERVAL_DAILY, now - 3 * 86400000L, now);
                  if (l != null) {
                    HashMap<String, Long> tot = new HashMap<>();
                    for (UsageStats us : l) {
                      if (now - us.getLastTimeUsed() < 15 * 60000L) s.add(us.getPackageName());
                      Long o = tot.get(us.getPackageName());
                      tot.put(us.getPackageName(), (o == null ? 0L : o) + us.getTotalTimeInForeground());
                    }
                    ArrayList<Map.Entry<String, Long>> es = new ArrayList<>(tot.entrySet());
                    Collections.sort(es, (a, b) -> Long.compare(b.getValue(), a.getValue()));
                    for (int i = 0; i < es.size() && i < top; i++) s.add(es.get(i).getKey());
                  }
                } catch (Throwable t) {
                }
              }
              return s;
            }

            /** Fecha processos em segundo plano de apps comuns (não mexe em apps de sistema puros). Rodar fora da thread principal. */
            static long clean(Context c, String why) {
              int prof = U.p(c).getInt("profile", 1);
              long before = U.mem(c)[0];
              ActivityManager am = (ActivityManager) c.getSystemService(Context.ACTIVITY_SERVICE);
              PackageManager pm = c.getPackageManager();
              Set<String> keep = protect(c, prof == 2 ? 3 : (prof == 1 ? 6 : 10));
              int n = 0;
              for (ApplicationInfo a : pm.getInstalledApplications(0)) {
                boolean sys = (a.flags & ApplicationInfo.FLAG_SYSTEM) != 0;
                boolean upd = (a.flags & ApplicationInfo.FLAG_UPDATED_SYSTEM_APP) != 0;
                if (sys && !upd) continue;
                if (keep.contains(a.packageName)) continue;
                if ((a.flags & ApplicationInfo.FLAG_STOPPED) != 0) continue;
                if (upd && pm.getLaunchIntentForPackage(a.packageName) == null) continue;
                try {
                  am.killBackgroundProcesses(a.packageName);
                  n++;
                } catch (Throwable t) {
                }
              }
              try {
                Thread.sleep(1200);
              } catch (Exception e) {
              }
              long freed = U.mem(c)[0] - before;
              U.log("Limpeza (" + why + "): " + n + " apps, " + (freed >= 0 ? "+" : "") + U.mb(freed) + " de RAM");
              SharedPreferences p = U.p(c);
              p.edit().putLong("freed_total", p.getLong("freed_total", 0) + Math.max(0, freed)).apply();
              return freed;
            }

            // ---------- ADB ----------
            static void anim(Context c, String v) {
              String[] k = {"window_animation_scale", "transition_animation_scale", "animator_duration_scale"};
              boolean ok = true;
              try {
                for (String s : k) ok &= Settings.Global.putString(c.getContentResolver(), s, v);
              } catch (Throwable t) {
                ok = false;
              }
              if (ok) {
                U.log("Animações " + v + "x aplicadas");
              } else {
                String r = Adb.run(c, 15000, "settings put global window_animation_scale " + v,
                    "settings put global transition_animation_scale " + v, "settings put global animator_duration_scale " + v);
                U.log("Animações " + v + "x via ADB: " + brief(r));
              }
            }

            static void cached(Context c, int n) {
              String r;
              if (n <= 0) r = Adb.run(c, 15000, "device_config delete activity_manager max_cached_processes");
              else r = Adb.run(c, 15000, "device_config put activity_manager max_cached_processes " + n);
              U.log("Limite de processos em cache " + (n <= 0 ? "padrão" : String.valueOf(n)) + ": " + brief(r));
            }

            static int[] phys(Context c) {
              SharedPreferences p = U.p(c);
              if (p.getInt("pw", 0) > 0) return new int[]{p.getInt("pw", 0), p.getInt("ph", 0), p.getInt("pd", 0)};
              String r = Adb.run(c, 15000, "wm size", "wm density");
              Matcher m = Pattern.compile("Physical size: (\\d+)x(\\d+)").matcher(r);
              Matcher d = Pattern.compile("Physical density: (\\d+)").matcher(r);
              if (m.find() && d.find()) {
                int w = Integer.parseInt(m.group(1)), h = Integer.parseInt(m.group(2)), dd = Integer.parseInt(d.group(1));
                p.edit().putInt("pw", w).putInt("ph", h).putInt("pd", dd).apply();
                return new int[]{w, h, dd};
              }
              U.log("Não li a resolução: " + brief(r));
              return null;
            }

            static boolean setRes(Context c, int pct) {
              int[] ph = phys(c);
              if (ph == null) return false;
              SharedPreferences p = U.p(c);
              if (pct >= 100) {
                String r = Adb.run(c, 15000, "wm size reset", "wm density reset");
                p.edit().putBoolean("res_pending", false).apply();
                U.log("Resolução original: " + brief(r));
                return true;
              }
              int w = Math.round(ph[0] * pct / 100f / 2f) * 2;
              int h = Math.round(ph[1] * pct / 100f / 2f) * 2;
              int d = Math.round(ph[2] * pct / 100f);
              p.edit().putBoolean("res_pending", true).putLong("res_ts", System.currentTimeMillis()).apply();
              String r = Adb.run(c, 15000, "wm size " + w + "x" + h, "wm density " + d);
              U.log("Resolução " + pct + "% (" + w + "x" + h + ", " + d + "dpi): " + brief(r));
              if (!Adb.ok(r)) {
                p.edit().putBoolean("res_pending", false).apply();
                return false;
              }
              return true;
            }

            static void keepRes(Context c) {
              U.p(c).edit().putBoolean("res_pending", false).apply();
              U.log("Resolução mantida");
            }

            static void revertRes(Context c) {
              String r = Adb.run(c, 15000, "wm size reset", "wm density reset");
              U.p(c).edit().putBoolean("res_pending", false).apply();
              U.log("Resolução revertida: " + brief(r));
            }

            /** Rede de segurança: se a resolução nova não foi confirmada, volta sozinha. */
            static void checkRevert(Context c) {
              SharedPreferences p = U.p(c);
              if (p.getBoolean("res_pending", false) && System.currentTimeMillis() - p.getLong("res_ts", 0) > 40000) {
                U.log("Resolução não confirmada: revertendo");
                revertRes(c);
              }
            }

            static void applyProfile(Context c, int prof) {
