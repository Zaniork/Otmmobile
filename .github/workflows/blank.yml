                  if (prof >= 1 || u > 0.75f) h.postDelayed(new Runnable() {
                    public void run() {
                      doClean("tela apagada");
                    }
                  }, 8000);
                } catch (Throwable t) {
                }
              }
            };

            final Runnable tick = new Runnable() {
              @Override
              public void run() {
                boolean on = true;
                try {
                  on = pw.isInteractive();
                  int prof = U.p(OptService.this).getInt("profile", 1);
                  float p = Brain.I.step(OptService.this, on);
                  lastP = p;
                  long[] m = U.mem(OptService.this);
                  float u = 1f - (float) m[0] / Math.max(1L, m[1]);
                  long now = SystemClock.elapsedRealtime();
                  if (now - lastClean > CD[prof]) {
                    if (on && (p >= THR[prof] || u > HARD[prof])) doClean("IA " + Math.round(p * 100) + "%");
                    else if (!on && u > 0.80f) doClean("tela apagada");
                  }
                  Opt.checkRevert(OptService.this);
                  m = U.mem(OptService.this);
                  String txt = "RAM livre " + U.mb(m[0]) + " (" + Math.round(100f * m[0] / Math.max(1L, m[1])) + "%) • risco "
                      + Math.round(p * 100) + "% • liberado " + U.mb(U.p(OptService.this).getLong("freed_total", 0));
                  ((NotificationManager) getSystemService(NOTIFICATION_SERVICE)).notify(1, notif("Turbo ativo", txt));
                } catch (Throwable t) {
                  U.log("ciclo: " + t);
                }
                h.postDelayed(this, on ? 15000 : 60000);
              }
            };

