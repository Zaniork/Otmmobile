# =====================================================================
#  TURBO - Otimizador de celular com IA local, ADB e servico sempre ativo
#  ARQUIVO UNICO: salve como  .github/workflows/build.yml  no seu repositorio.
#  Ele cria o projeto Android inteiro sozinho, compila e publica o APK.
#  Baixe o APK em: aba "Releases" (direto, sem zip) ou em Actions > Artifacts.
# =====================================================================
name: Build Turbo APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Gerar projeto Android
        run: |
          cat > settings.gradle << 'EOF_0'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement {
            repositoriesMode.set(RepositoriesMode.PREFER_SETTINGS)
            repositories { google(); mavenCentral() }
          }
          rootProject.name = "Turbo"
          include ':app'
          EOF_0
          cat > build.gradle << 'EOF_1'
          plugins { id 'com.android.application' version '8.1.4' apply false }
          EOF_1
          cat > gradle.properties << 'EOF_2'
          org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
          android.useAndroidX=false
          android.nonTransitiveRClass=true
          EOF_2
          mkdir -p app
          cat > app/build.gradle << 'EOF_3'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.turbo.a03'
            compileSdk 34
            defaultConfig {
              applicationId "com.turbo.a03"
              minSdk 26
              targetSdk 33
              versionCode 1
              versionName "1.0"
            }
            buildTypes { release { minifyEnabled false } }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_1_8
              targetCompatibility JavaVersion.VERSION_1_8
            }
            lint { abortOnError false }
          }
          tasks.withType(JavaCompile) { options.encoding = 'UTF-8' }
          EOF_3
          mkdir -p app/src/main
          cat > app/src/main/AndroidManifest.xml << 'EOF_4'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">
            <uses-permission android:name="android.permission.INTERNET"/>
            <uses-permission android:name="android.permission.FOREGROUND_SERVICE"/>
            <uses-permission android:name="android.permission.RECEIVE_BOOT_COMPLETED"/>
            <uses-permission android:name="android.permission.KILL_BACKGROUND_PROCESSES"/>
            <uses-permission android:name="android.permission.REQUEST_IGNORE_BATTERY_OPTIMIZATIONS"/>
            <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>
            <uses-permission android:name="android.permission.QUERY_ALL_PACKAGES" tools:ignore="QueryAllPackagesPermission"/>
            <uses-permission android:name="android.permission.PACKAGE_USAGE_STATS" tools:ignore="ProtectedPermissions"/>
            <uses-permission android:name="android.permission.WRITE_SECURE_SETTINGS" tools:ignore="ProtectedPermissions"/>
            <application
                android:label="Turbo"
                android:icon="@drawable/ic_launcher"
                android:allowBackup="false"
                android:theme="@android:style/Theme.DeviceDefault.NoActionBar">
              <activity android:name=".MainActivity" android:exported="true"
                  android:launchMode="singleTop"
                  android:configChanges="orientation|screenSize|smallestScreenSize|screenLayout|density|keyboard|keyboardHidden|uiMode|fontScale">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
