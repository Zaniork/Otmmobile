              String r = Adb.run(c, 1800000, "cmd package compile -m speed-profile -a");
              U.log("Compilação: " + brief(r));
            }

            static void applyRestrict(Context c, Set<String> old, Set<String> nw) {
              ArrayList<String> cmds = new ArrayList<>();
              for (String p : nw) cmds.add("cmd appops set " + p + " RUN_ANY_IN_BACKGROUND ignore");
              for (String p : old) if (!nw.contains(p)) cmds.add("cmd appops set " + p + " RUN_ANY_IN_BACKGROUND default");
              if (cmds.isEmpty()) return;
              String r = Adb.run(c, 30000, cmds.toArray(new String[0]));
              U.log("Segundo plano: " + nw.size() + " apps restritos (" + brief(r) + ")");
            }

            static void restoreAll(Context c) {
              SharedPreferences p = U.p(c);
              Set<String> rs = new HashSet<>(p.getStringSet("restricted", new HashSet<String>()));
              ArrayList<String> cmds = new ArrayList<>(Arrays.asList(
                  "settings put global window_animation_scale 1.0",
                  "settings put global transition_animation_scale 1.0",
                  "settings put global animator_duration_scale 1.0",
                  "wm size reset", "wm density reset",
                  "device_config delete activity_manager max_cached_processes"));
              for (String s : rs) cmds.add("cmd appops set " + s + " RUN_ANY_IN_BACKGROUND default");
              String r = Adb.run(c, 30000, cmds.toArray(new String[0]));
              p.edit().putStringSet("restricted", new HashSet<String>()).putBoolean("res_pending", false).apply();
              U.log("Tudo restaurado: " + brief(r));
            }
          }
